      var k = e.key, h = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -8], ArrowDown: [0, 8] }[k];
      if (h) { e.preventDefault(); st.yaw += h[0]; st.pitch = Math.max(-60, Math.min(89, st.pitch + h[1])); draw(); }
      else if (k === "+" || k === "=") { st.zoom = Math.min(2.6, st.zoom * 1.2); draw(); }
      else if (k === "-") { st.zoom = Math.max(0.6, st.zoom / 1.2); draw(); }
    });
    var onResize = function () { if (!document.body.contains(cv)) { window.removeEventListener("resize", onResize); return; } size(); draw(); };
    window.addEventListener("resize", onResize);
    size(); draw();
  }

  /* ---------- home: tool rows (localizers, drugs, guides, ICD) ---------- */
  function toolRow(href, abbr, name, desc) {
    return '<a class="row" href="' + href + '"><span class="abbr">' + abbr + '</span><span class="txt"><span class="name">' + name + '</span><span class="desc">' + desc + '</span></span><span class="chev">' + ICON.chev + '</span></a>';
  }
  function homeTiles() {
    var tile = function (href, abbr, name, sub, wide) {
      return '<a class="tile' + (wide ? ' wide' : '') + '" href="' + href + '"><span class="tabbr">' + abbr + '</span>' + (wide ? '<span class="twrap">' : '') +
        '<span class="tname">' + name + '</span><span class="tsub">' + sub + '</span>' + (wide ? '</span>' : '') + '</a>';
    };
    var tr = guideById("trials"), nTr = tr ? tr.sections.reduce(function (n, s) { return n + (s.cards ? s.cards.length : 0); }, 0) : 0;
    return [
      tile("#loc", "LOC", "Nerve localizer", "Roots and peripheral nerves"),
      tile("#cns", "CNS", "Brain &amp; eye", "Pupils, eye movements, fields, aphasia"),
      tile("#drugs", "RX", "Drug doses", DRUGS.length + " drugs and interactions"),
      tile("#guides", "GDE", "Guides", "Admissions, post-op, VTE, brain death"),
      tile("#guide/trials", "RCT", "Landmark papers", nTr + " trials in brief"),
      tile("#icd", "ICD", "ICD codes", (icdCount(icdMatches("", "dx")) + icdCount(icdMatches("", "px"))) + " ICD-10 and ICD-9 codes"),
      tile("#fig", "FIG", "Diagrams", (ATLAS.length - 1) + " labelled drawings and a 3D skull with access points", true)
    ];
  }
  function homeTools(query) {
    var q = query.trim(), rows = [];
    if (!q) {
      rows.push(toolRow("#loc", "LOC", "Lesion localizer", "Roots and peripheral nerves: pain, weakness, reflexes and how to examine"));
      rows.push(toolRow("#cns", "CNS", "Brain &amp; eye localizer", "Pupils, eye movements, visual fields and aphasia: where the lesion is and why"));
      rows.push(toolRow("#drugs", "RX", "Drug doses &amp; interactions", DRUGS.length + " drugs: adult and child doses by weight, kidney adjustments, interaction checker"));
      rows.push(toolRow("#fig", "FIG", "Diagrams", ATLAS.length + " labelled drawings of key anatomy, with short notes"));
      rows.push(toolRow("#guides", "GDE", "Guides &amp; checklists", "Common admissions, post-op care, VTE timing, brain death, spine measurement"));
      rows.push(toolRow("#guide/trials", "RCT", "Landmark papers", "Short, plain summaries of the trials every neurosurgery resident should know"));
      rows.push(toolRow("#icd", "ICD", "ICD-10 &amp; ICD-9 codes", (icdCount(icdMatches("", "dx")) + icdCount(icdMatches("", "px"))) + " neurosurgery and spine codes: diagnoses and procedures"));
      return rows;
    }
    var lm = locMatches(q), ln = lm.roots + lm.nerves;
    if (ln) rows.push(toolRow("#loc/" + encodeURIComponent(q), "LOC", "Lesion localizer", (ln === 1 ? "1 root or nerve mentions “" : ln + " roots or nerves mention “") + esc(q) + "”"));
    var cs = cnsSearch(q);
    if (cs.n) rows.push(toolRow(cs.href, "CNS", "Brain &amp; eye localizer", cs.n + (cs.n === 1 ? " pattern mentions “" : " patterns mention “") + esc(q) + "”"));
    var as = atlasSearch(q);
    if (as.n) rows.push(toolRow(as.href, "FIG", "Diagrams", as.n + (as.n === 1 ? " diagram mentions “" : " diagrams mention “") + esc(q) + "”"));
    var gs = guideSearch(q);
    if (gs.n) rows.push(toolRow(gs.href, "GDE", "Guides &amp; checklists", gs.n + (gs.n === 1 ? " guide item mentions “" : " guide items mention “") + esc(q) + "”"));
    var rn = rxMatches(q);
    if (rn) rows.push(toolRow("#drugs/" + encodeURIComponent(q), "RX", "Drug doses &amp; interactions", rn + " drug" + (rn === 1 ? "" : "s") + " match “" + esc(q) + "”"));
    var ih = icdCount(icdMatches(q, "dx")) + icdCount(icdMatches(q, "px"));
    if (ih) rows.push(toolRow("#icd/" + encodeURIComponent(q), "ICD", "ICD-10 &amp; ICD-9 codes", ih + " code" + (ih === 1 ? "" : "s") + " match “" + esc(q) + "”"));
    return rows;
  }

  /* ---------- routing ---------- */
  function route() {
    var id = (location.hash || "").replace(/^#/, "");
    /* drop a calculator's result bar left on the page before showing another screen */
    var oldBar = document.querySelector("body > .result"); if (oldBar) oldBar.remove();
    document.body.style.overflow = "";
    if (id === "fig" || id.indexOf("fig/") === 0) {
      var ap = id.slice(4), fq = "";
      if (ap.indexOf("find/") === 0) { try { fq = decodeURIComponent(ap.slice(5)); } catch (e) {} renderAtlas(fq); window.scrollTo(0, 0); return; }
      var fd = ap && atlasById(ap);
      if (fd) renderFigure(fd); else renderAtlas("");
      window.scrollTo(0, 0); return;
    }
    if (id === "loc" || id.indexOf("loc/") === 0) {
      var lq = ""; try { lq = decodeURIComponent(id.slice(4)); } catch (e) {}
      loc.q = lq; loc.open = "";
      if (lq) { var lm = locMatches(lq), rootQ = /^[ctls]\d/i.test(lq.trim()); loc.tab = rootQ ? (lm.roots ? "roots" : "nerves") : (lm.nerves ? "nerves" : "roots"); }
      renderLoc(); window.scrollTo(0, 0); return;
    }
    if (id === "cns" || id.indexOf("cns/") === 0) {
      var cp = id.split("/");
      if (cp[1] && CNS_TABS.some(function (t) { return t[0] === cp[1]; })) cns.tab = cp[1];
      cns.open = ""; try { cns.open = cp[2] ? decodeURIComponent(cp[2]) : ""; } catch (e) {}
      renderCns(); window.scrollTo(0, 0);
      var ce = cns.open && document.getElementById("cn-" + cns.tab + "-" + cns.open); if (ce) ce.scrollIntoView({ block: "start" });
      return;
    }
    if (id === "guides") { renderGuides(); window.scrollTo(0, 0); return; }
    if (id.indexOf("guide/") === 0) {
      var gp = id.slice(6).split("/"), gg = guideById(gp[0]);
      if (gg) { renderGuide(gg, gp[1] ? "gc-" + gp[1] : ""); window.scrollTo(0, 0); return; }
    }
    if (id === "drugs" || id.indexOf("drugs/") === 0) {
      var dq = ""; try { dq = decodeURIComponent(id.slice(6)); } catch (e) {}
      rx.tab = "dose";
      /* coming back from a calculator opened on this page: keep the search and the open card */
      if (!rx.back || dq) { rx.q = dq; rx.cat = "all"; rx.open = ""; }
      var kept = rx.back && !dq; rx.back = false;
      if (dq) { var one = DRUGS.filter(function (d) { return rxHit(d, dq); }); if (one.length === 1) rx.open = one[0].id; }
      renderDrugs(); window.scrollTo(0, 0);
      var openEl = kept && rx.open && document.getElementById("rx-" + rx.open); if (openEl) openEl.scrollIntoView({ block: "start" });
      return;
    }
    if (id === "icd" || id.indexOf("icd/") === 0) {
      var q = ""; try { q = decodeURIComponent(id.slice(4)); } catch (e) {}
      icd.q = q; icd.group = "All";
      if (q && !icdCount(icdMatches(q, icd.tab)) && icdCount(icdMatches(q, icd.tab === "dx" ? "px" : "dx"))) icd.tab = icd.tab === "dx" ? "px" : "dx";
      renderIcd(); window.scrollTo(0, 0); return;
    }
    var c = id && byId(id);
    if (c) { renderCalc(c); window.scrollTo(0, 0); }
    else { renderHome(); }
  }
  /* remember how far down each screen the reader was, and return there with Back */
  var navStack = [], scrollMem = {}, lastY = 0;
  window.addEventListener("scroll", function () { lastY = window.scrollY || window.pageYOffset || 0; }, { passive: true });
  function routeWithMemory() {
    var hsh = location.hash || "#", prev = navStack[navStack.length - 1];
    if (prev !== undefined) scrollMem[prev] = lastY;
    var back = navStack.length > 1 && navStack[navStack.length - 2] === hsh;
    if (back) navStack.pop(); else if (prev !== hsh) navStack.push(hsh);
    if (navStack.length > 60) navStack.splice(0, navStack.length - 60);
    route();
    var y = back ? scrollMem[hsh] : 0;
    if (y > 0) setTimeout(function () { window.scrollTo(0, y); lastY = y; }, 0);
  }
  /* the back arrow in the header: go back to the previous screen of the app, not always to its parent list */
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest(".topbar a.iconbtn");
    if (!t || e.metaKey || e.ctrlKey || navStack.length < 2) return;
    e.preventDefault(); history.back();
  });
  window.addEventListener("hashchange", routeWithMemory);
  routeWithMemory();

  /* ---------- offline support (works when hosted on your own https site) ---------- */
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        try {
          navigator.serviceWorker.register("sw.js").then(function (reg) {
            /* look for a new version every time the app is opened or brought back to the screen */
            try { reg.update(); } catch (e) {}
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") { try { reg.update(); } catch (e) {} }
            });
          }).catch(function () {});
        } catch (e) {}
      });
    }
  } catch (e) {}
})();
</script>
