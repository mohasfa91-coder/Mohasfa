<style>
/* Layout idea: one narrow app column; list of scores, then a calculator with tap-to-answer option rows and a live result bar pinned to the bottom. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --ink: #13201f;
  --muted: #586967;
  --line: #d5dedd;
  --accent: #0b6e66;
  --accent-ink: #ffffff;
  --accent-soft: #e0f0ee;
  --ok: #2e7d32;
  --warn: #a35f00;
  --crit: #b3261e;
  --info: #35598f;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1515;
    --surface: #162120;
    --ink: #e4eceb;
    --muted: #97a8a6;
    --line: #293836;
    --accent: #4cbfb2;
    --accent-ink: #062320;
    --accent-soft: #143331;
    --ok: #74c47a;
    --warn: #e3a64a;
    --crit: #f07068;
    --info: #8eaee0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1515;
  --surface: #162120;
  --ink: #e4eceb;
  --muted: #97a8a6;
  --line: #293836;
  --accent: #4cbfb2;
  --accent-ink: #062320;
  --accent-soft: #143331;
  --ok: #74c47a;
  --warn: #e3a64a;
  --crit: #f07068;
  --info: #8eaee0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { scroll-padding-bottom: 170px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 14px 0 10px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.brand h1 { font-size: 24px; letter-spacing: .2px; }
.brand p { margin: 0; color: var(--muted); font-size: 13.5px; }
.mark {
  width: 36px; height: 36px; border-radius: 9px; flex: none;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .5px;
}
.iconbtn {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; height: 38px; min-width: 38px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 500;
  color: var(--ink); text-decoration: none;
}
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); }
.calc-title { flex: 1; min-width: 0; }
.calc-title h1 { font-size: 21px; line-height: 1.15; }
.calc-title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- home ---------- */
.notice {
  margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1px solid var(--line);
  display: flex; gap: 12px; align-items: flex-start; font-size: 14px;
}
.notice p { margin: 0; flex: 1; }
.notice button {
  border: 0; background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; flex: none;
}
.search { margin: 14px 0 4px; position: relative; }
.search input {
  width: 100%; height: 46px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface);
  padding: 0 14px 0 40px; font-size: 16px;
}
.search svg { position: absolute; left: 13px; top: 14px; width: 18px; height: 18px; color: var(--muted); }
.group { margin-top: 20px; }
.group h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--muted); font-family: var(--font-body); font-weight: 600; margin: 0 0 8px 2px;
}
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; text-decoration: none; color: inherit;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row .abbr {
  flex: none; width: 54px; height: 34px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.1;
}
.row .txt { flex: 1; min-width: 0; }
.row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.row .name .star { color: var(--warn); font-size: 13px; }
.row .desc { color: var(--muted); font-size: 13.5px; }
.row .chev { color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 18px 2px; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 26px; line-height: 1.5; }
.copy { margin-top: 10px; font-size: 12px; }
.copy strong { color: var(--ink); font-weight: 600; }

/* ---------- calculator ---------- */
.intro { margin: 14px 0 0; color: var(--muted); font-size: 14.5px; }
.items { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 12px 10px;
}
.item.skipped { opacity: .5; }
.item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 8px; }
.item-head h3 { font-size: 17px; }
.item-head .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.item .hint { margin: -4px 2px 8px; font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; min-height: 44px;
}
.opt .dot {
  flex: none; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--muted); position: relative;
}
.opt.check .dot { border-radius: 5px; }
.opt .otext { flex: 1; min-width: 0; }
.opt .olabel { font-weight: 500; font-size: 15px; }
.opt .osub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.opt .pts {
  flex: none; font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--muted); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums;
}
.opt[aria-checked="true"], .opt[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft);
}
.opt[aria-checked="true"] .dot, .opt[aria-pressed="true"] .dot { border-color: var(--accent); }
.opt[aria-checked="true"] .dot::after, .opt[aria-pressed="true"] .dot::after {
  content: ""; position: absolute; inset: 3px; border-radius: inherit; background: var(--accent);
}
.opt[aria-checked="true"] .pts, .opt[aria-pressed="true"] .pts { color: var(--accent); }
.opt:disabled { cursor: default; }

.helper {
  margin-top: 10px; padding: 10px; border-radius: 8px;
  border: 1px dashed var(--line);
}
.helper h4 { margin: 0 0 6px; font-size: 14px; font-family: var(--font-body); font-weight: 600; }
.helper .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.helper label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.helper input {
  height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 8px; font-family: var(--font-mono); font-size: 16px; font-variant-numeric: tabular-nums;
}
.helper .out { margin-top: 8px; font-size: 14px; }
.helper .out strong { font-family: var(--font-mono); }
.helper .small { font-size: 12px; color: var(--muted); margin-top: 4px; }

.block { margin-top: 18px; }
.block h2 { font-size: 15px; margin: 0 0 6px 2px; }
.block ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--muted); }
.block li + li { margin-top: 4px; }

.spacer { height: 150px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip {
  min-height: 38px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 500;
}
.chip span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: 2px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.fieldhead { font-size: 18px; margin: 22px 2px -10px; color: var(--accent); }
/* home: big section headings and tool tiles */
.sechead { display: flex; align-items: baseline; gap: 8px; font-size: 23px; margin: 24px 0 10px; padding-left: 10px; border-left: 4px solid var(--accent); line-height: 1.15; }
.sechead span { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--muted); }
.sechead + .chips { margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 116px; padding: 11px 10px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: inherit; text-decoration: none; }
.tile:hover, .tile:active { background: var(--accent-soft); border-color: var(--accent); }
.tile .tabbr { align-self: flex-start; padding: 4px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; }
.tile .tname { font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.tile .tsub { font-size: 12px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
@media (max-width: 340px) { .tiles { grid-template-columns: 1fr 1fr; } }
.sec-act { margin-left: auto; align-self: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--accent); min-height: 34px; }
.list.cats { margin-top: 18px; }
details.cat { border-top: 1px solid var(--line); }
details.cat:first-child { border-top: 0; }
details.cat > summary { display: flex; align-items: center; gap: 10px; padding: 14px; min-height: 52px; cursor: pointer; list-style: none; }
details.cat > summary::-webkit-details-marker { display: none; }
details.cat .cname { flex: 1; min-width: 0; font-weight: 600; font-size: 15.5px; }
details.cat .ccount { flex: none; padding: 2px 9px; border-radius: 999px; background: var(--bg); font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
details.cat .cchev { flex: none; display: grid; color: var(--muted); transition: transform .15s; }
details.cat[open] > summary { background: var(--accent-soft); }
details.cat[open] .cname { color: var(--accent); }
details.cat[open] .cchev { transform: rotate(90deg); }
.cat-body .row:first-child { border-top: 1px solid var(--line); }
.legend { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.legend strong { color: var(--ink); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(30px, 1fr)); gap: 5px; }
.segbtn {
  height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
  font-family: var(--font-mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums;
}
.segbtn[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.segbtn:disabled { cursor: default; }
.segsel { margin: 6px 2px 0; font-size: 13.5px; }
.segsel span { color: var(--muted); }
.nums { margin-top: 0; border-style: solid; }
.helper .fields.fields-2, .helper .fields.fields-4 { grid-template-columns: 1fr 1fr; }
.helper label { min-width: 0; }
.helper input { width: 100%; min-width: 0; }
.res-detail.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.helper input.chk { border-color: var(--warn); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 35%, transparent); }
.linkbtn { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 32px; }
.imgmiss { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 13px; }
/* landscape phones: let the header scroll away so more of the page is visible */
@media (max-height: 460px) { .topbar { position: static; } }
.negwrap { display: flex; gap: 4px; }
.negwrap input { flex: 1; }
.negbtn { flex: none; width: 38px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-size: 17px; color: var(--ink); }

/* ---------- ICD codes ---------- */
.icd-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.icd-tabs button {
  height: 42px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 15px;
}
.icd-tabs button span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.icd-tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.icd-tabs button[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.icd-filter { margin-top: 10px; }
.icd-filter select {
  width: 100%; height: 42px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink);
}
.icd-hint { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.icd-note { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 12.5px; color: var(--ink); }
.icd-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border-top: 1px solid var(--line); }
.icd-row:first-child { border-top: 0; }
.icd-row .txt { flex: 1; min-width: 0; }
.icd-row .ttl { font-size: 14.5px; font-weight: 500; line-height: 1.35; }
.icd-row .nine { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.icd-row .nine b { font-weight: 600; color: var(--ink); font-size: 11.5px; letter-spacing: .3px; margin-right: 4px; }
.code {
  flex: none; min-width: 64px; min-height: 34px; padding: 7px 8px; border-radius: 7px;
  border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); font-weight: 600; font-size: 14px; text-align: center; line-height: 1.2;
}
.code.sm { min-width: 0; padding: 7px 9px; margin: 2px 0; font-size: 13px; min-height: 34px; border-color: var(--line); background: var(--bg); color: var(--ink); }
.code:active { transform: scale(.97); }
.icd-entry { margin-top: 12px; }
.icd-tabs.three { grid-template-columns: 1fr 1fr 1fr; }
.icd-tabs.four { grid-template-columns: repeat(4, 1fr); }
.icd-tabs.four button { font-size: 14px; padding: 0 2px; }
.item-head h2 { font-size: 17px; }
/* keep cards opened by a link clear of the sticky top bar */
details.lc, .group, details.cat { scroll-margin-top: 96px; }
.sechead { scroll-margin-top: 150px; }
svg.vf { flex: none; width: 118px; height: 60px; }
.vf-bg { fill: var(--surface); }
.vf-rim { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.vf-ax { stroke: var(--line); stroke-width: .8; }
.vf-loss { fill: var(--crit); opacity: .65; }
.vf-lb { font-size: 8px; fill: var(--muted); font-family: var(--font-body); }
details.vf-card summary { gap: 10px; padding: 10px 12px; }
.aph-out { padding: 12px 14px; }
.aph-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--accent); margin-bottom: 4px; }
.gchk-actions { margin-top: 12px; display: flex; justify-content: flex-end; }
.gchk { margin-top: 14px; }
.icd-hint a { color: var(--accent); }
details.lc { border-top: 1px solid var(--line); }
details.lc:first-child { border-top: 0; }
details.lc summary { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none; }
details.lc summary::-webkit-details-marker { display: none; }
details.lc summary .abbr { flex: none; width: 54px; height: 34px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
details.lc summary .txt { flex: 1; min-width: 0; }
details.lc summary .name { display: block; font-weight: 600; }
details.lc summary .desc { display: block; color: var(--muted); font-size: 13.5px; }
details.lc[open] summary { background: var(--accent-soft); }
.lc-body { padding: 4px 14px 12px; }
.rx-pt { margin-top: 14px; border-style: solid; background: var(--surface); }
.rx-pt .icd-tabs { margin-top: 0; }
.rx-pt .icd-tabs button { height: 38px; font-size: 14px; }
.rx-pt .fields { margin-top: 10px; }
.rx-pt label { min-width: 0; }
.rx-pt input { width: 100%; min-width: 0; }
.rx-pt a, .rx-refs a, .rx-link { color: var(--accent); font-weight: 600; }
.rx-use { padding: 9px 0; border-top: 1px dashed var(--line); }
.rx-use:first-child { border-top: 0; }
.rx-ind { font-weight: 600; font-size: 14px; }
.rx-txt { font-size: 14px; line-height: 1.45; margin-top: 2px; }
.rx-na { font-size: 13.5px; color: var(--muted); margin-top: 2px; font-style: italic; }
.rx-dose { display: inline-block; margin-top: 6px; padding: 4px 9px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rx-dose.cap { color: var(--warn); background: var(--surface); border: 1px solid var(--warn); }
.rx-rows { margin-top: 4px; border-top: 1px solid var(--line); }
.rx-rows .lc-row:first-child { border-top: 0; }
.lc-row.rx-flag span { color: var(--warn); }
.icd-note.rx-warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); font-weight: 600; }
.rx-refs { display: block; font-size: 12.5px; color: var(--muted); }
.rx-chips { margin-top: 0; gap: 6px; }
.rx-chips .chip { font-size: 13.5px; padding: 6px 11px; }

{

  items: [
    { id: "sex", label: "Sex", options: [opt("m", "Male"), opt("f", "Female")] },
    { id: "q1", label: "1. How often do you have a drink containing alcohol?", options: [opt(0, "Never", 0), opt(1, "Monthly or less", 1), opt(2, "2–4 times a month", 2), opt(3, "2–3 times a week", 3), opt(4, "4 or more times a week", 4)] },

/* ---- pure helpers (shared by the page and the tests) ---- */
function drugRound(v) {
  var r = v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100;
  return String(r);
}
/* dose for one weight. Returns null when the entry has no weight-based number. */
function drugDose(spec, wt) {
  if (!spec || !(wt > 0)) return null;
  if (spec.bands) {
    var b = spec.bands.find(function (x) { return wt >= x[0] && (x[1] === null || wt <= x[1]); });
    return b ? { lo: b[2], hi: b[2], u: spec.u, capped: false, fixed: true } : { none: true, u: spec.u };
  }
  if (spec.k === undefined) return null;
  var k = Array.isArray(spec.k) ? spec.k : [spec.k, spec.k], max = spec.max || Infinity;
  var lo = k[0] * wt, hi = k[1] * wt, capped = hi > max;
  lo = Math.min(lo, max); hi = Math.min(hi, max);
  var out = { lo: lo, hi: hi, u: spec.u, capped: capped, max: spec.max, ml: spec.ml, mlTxt: spec.mlTxt };
  if (spec.per === "day") { out.per = "day"; out.div = spec.div || 1; }
  return out;
}
function drugDoseText(d) {
  if (!d) return "";
  if (d.none) return "No dose for this weight";
  var rng = function (a, b) { return drugRound(a) === drugRound(b) ? drugRound(a) : drugRound(a) + "–" + drugRound(b); };
  var t = rng(d.lo, d.hi) + " " + d.u;
  if (d.per === "day") t += "/day" + (d.div > 1 ? " (" + rng(d.lo / d.div, d.hi / d.div) + " " + d.u + " × " + d.div + ")" : "");
  if (d.ml) t += " = " + rng(d.lo * d.ml, d.hi * d.ml) + " mL" + (d.mlTxt ? " " + d.mlTxt : "");
  if (d.capped) t += " · capped at the maximum";
  return t;
}
/* tags of a drug or long-term medicine, including its own id */
function drugTags(id) {
  var x = DRUGS.find(function (d) { return d.id === id; }) || CHRONIC.find(function (d) { return d.id === id; });
  return x ? [x.id].concat(x.tags || []) : [];
}
var IXN_ORDER = { avoid: 0, major: 1, moderate: 2 };
/* interactions among the selected ids, most serious first */
function drugIxns(ids) {
  var out = [];
  for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++) {
    var A = drugTags(ids[i]), B = drugTags(ids[j]), found = [];
    IXN.forEach(function (r) {
      if ((A.indexOf(r.a) !== -1 && B.indexOf(r.b) !== -1) || (A.indexOf(r.b) !== -1 && B.indexOf(r.a) !== -1)) found.push(r);
    });
    var specific = found.filter(function (r) { return !r.generic; });
    (specific.length ? specific : found.slice(0, 1)).forEach(function (r) { out.push({ a: ids[i], b: ids[j], sev: r.sev, t: r.t }); });
  }
  out.sort(function (x, y) { return IXN_ORDER[x.sev] - IXN_ORDER[y.sev]; });
  return out;
}

  cands: [
    { id: "horner", name: "Horner syndrome", short: "Small pupil, mild ptosis",
      look: "Smaller pupil that reacts to light; anisocoria larger in dim light; slow dilation after the light goes off (dilation lag); ptosis of 1–2 mm with a slightly raised lower lid; less sweating on that side of the face when the lesion is before the carotid bifurcation.",
      site: "Sympathetic pathway on the side of the small pupil. 1st neuron: hypothalamus, brainstem (lateral medulla), cervical cord to T1. 2nd neuron: T1 root, lung apex, neck. 3rd neuron: internal carotid artery wall, cavernous sinus.",
      causes: "Carotid dissection (painful Horner), lateral medullary stroke, Pancoast tumour, neck surgery or central line, lower brachial plexus injury, cavernous sinus lesions, cluster headache.",
      act: "Painful acute Horner: urgent CT or MR angiography of the neck for carotid dissection. Image the whole pathway (brain to chest) when the level is unclear. Apraclonidine drops reverse the anisocoria.",
      test: "Compare pupils in bright and dim light; watch the small pupil for 5 seconds after dimming; check the lower lid, sweating, other brainstem signs and the arm (lower plexus)." },
    { id: "cn3", name: "Third nerve palsy with a dilated pupil", short: "Ptosis, eye down and out, big pupil",

      causes: "Posterior communicating artery aneurysm (until proven otherwise), uncal herniation, trauma, pituitary apoplexy, cavernous sinus lesions. A pupil-sparing complete palsy in an older patient with diabetes or hypertension is often microvascular; pain is common and does not exclude it.",
      act: "Pupil involved: urgent CT angiography. Reduced consciousness: treat as herniation. Image partial or pupil-sparing palsies too if the patient is under 50 or has no vascular risk factors.",

      causes: "Acute subdural or extradural haematoma, intracerebral haemorrhage, large infarct with swelling, tumour, abscess.",
      act: "Emergency: airway, head up 30°, osmotherapy, brief hyperventilation as a bridge, urgent CT and neurosurgery.",
      test: "Pupil size and light reaction every hour with GCS in at-risk patients; record the time a change was first seen." },
    { id: "adie", name: "Adie tonic pupil", short: "Big pupil, slow near reaction",
      look: "Large pupil with absent or segmental light reaction, slow and sustained constriction to a near target (light–near dissociation), slow redilation. Often in young women; reduced tendon reflexes in Holmes–Adie syndrome.",
      site: "Ciliary ganglion or short ciliary nerves in the orbit (postganglionic parasympathetic).",
      causes: "Usually idiopathic, sometimes after viral illness, orbital trauma or surgery.",
      act: "Benign. Dilute pilocarpine (0.1%) constricts the tonic pupil but not a normal one (denervation supersensitivity). No imaging if the picture is typical.",
      test: "Light reaction with a bright torch and slit lamp if available; near target for 10–20 seconds; tendon reflexes." },
    { id: "pharm", name: "Drug-induced dilated pupil", short: "Very big pupil, no reaction, no ptosis",
      look: "Very large pupil (often 8 mm or more) with no reaction to light or near; no ptosis and normal eye movements.",
      site: "Iris muscle blocked by an anticholinergic or stimulated by an adrenergic drug; no nerve lesion.",
      causes: "Atropine or cyclopentolate drops, scopolamine patch, nebulised ipratropium leaking onto the eye, plants (jimsonweed), adrenergic drops.",
      act: "1% pilocarpine does not constrict it (a third nerve pupil does constrict). No imaging needed when the picture fits and the patient is alert.",
      test: "Ask about drops, nebulisers, patches and gardening; check lids and eye movements." },
    { id: "traumatic", name: "Traumatic mydriasis", short: "Irregular big pupil after eye trauma",

      site: "Iris sphincter muscle in the eye itself.",
      causes: "Blunt eye trauma, eye surgery.",
      act: "Does not mean herniation if the patient is alert and the pupil was injured directly; still examine and image when the head was also injured.",
      test: "Inspect the iris margin; check for hyphaema; compare with consciousness and other signs." },
    { id: "rapd", name: "Relative afferent pupil defect (Marcus Gunn)", short: "Optic nerve sign",
      look: "Pupils are equal in size. When the torch swings from the good eye to the affected eye, both pupils dilate instead of staying small.",
      site: "Optic nerve on that side (or severe retinal disease). Cataract and refractive error do not cause it.",
      causes: "Optic neuritis, ischaemic optic neuropathy, compression (tumour, aneurysm, thyroid eye disease), traumatic optic neuropathy, glaucoma, retinal detachment.",
      act: "Check acuity, colour vision and fields; fundoscopy. Traumatic optic neuropathy after head injury: CT orbits and optic canals.",
      test: "Swinging flashlight test in a dim room: 2–3 seconds on each eye, swing briskly back and forth several times." },
    { id: "pinpoint", name: "Pinpoint pupils (both)", short: "Pons or opioids",
      look: "Both pupils very small (1–2 mm); the light reaction is present but needs a magnifier to see.",
      site: "Pons (sympathetic pathways and parasympathetic disinhibition).",
      causes: "Pontine haemorrhage or infarct (coma, quadriparesis, ocular bobbing), opioids, organophosphates.",
      act: "Give naloxone if opioids are possible; urgent CT for pontine haemorrhage.",
      test: "Use a bright light and magnifier; look for ocular bobbing and absent horizontal eye movements." },
    { id: "metabolic", name: "Small reactive pupils in coma", short: "Metabolic or diencephalic",
      look: "Both pupils small but reactive. Preserved light reflexes in deep coma favour a metabolic or toxic cause over a structural one.",
      site: "Diffuse cortical or diencephalic (thalamic/hypothalamic) dysfunction.",
      causes: "Hypoglycaemia, uraemia, liver failure, sedatives, sepsis; early central herniation.",
      act: "Check glucose, sodium, urea, ammonia, blood gas and drug levels; CT if any focal sign.",
      test: "Pupil reaction with a bright light; oculocephalic reflexes; look for asterixis and myoclonus." },
    { id: "midfixed", name: "Mid-position fixed pupils (both)", short: "Midbrain",

      site: "Midbrain (both sympathetic and parasympathetic pathways interrupted).",
      causes: "Central herniation, midbrain haemorrhage or infarct, brain death.",
      act: "Emergency CT; check for sedatives and hypothermia before drawing conclusions.",
      test: "Bright light in a dark room; oculocephalic and corneal reflexes." },
    { id: "bothfixed", name: "Dilated fixed pupils (both)", short: "Severe brain injury or drugs",
      look: "Both pupils dilated and not reacting to light.",
      site: "Bilateral third nerve or midbrain failure, or global brain hypoxia.",
      causes: "Bilateral herniation, severe hypoxic–ischaemic injury after cardiac arrest, atropine and other anticholinergics, high-dose adrenaline during resuscitation.",
      act: "Do not prognosticate early after cardiac arrest or drugs; treat raised ICP; image urgently.",
      test: "Record time from arrest and drugs given; repeat after drug effects wear off." },
    { id: "lnd", name: "Light–near dissociation (both eyes)", short: "Parinaud or Argyll Robertson",
      look: "Both pupils constrict to a near target but poorly to light. Parinaud (dorsal midbrain) syndrome adds upgaze palsy, eyelid retraction and convergence–retraction nystagmus. Argyll Robertson pupils are small and irregular.",
      site: "Dorsal midbrain (pretectal area) or, for Argyll Robertson, the rostral midbrain.",
      causes: "Pineal region tumours, hydrocephalus or shunt failure (sunsetting eyes in children), midbrain stroke; neurosyphilis and diabetes (Argyll Robertson); bilateral Adie pupils.",
      act: "Brain MRI; check shunt function in shunted patients; syphilis serology for small irregular pupils.",
      test: "Compare the light reaction with the near reaction; test upgaze and convergence." },
    { id: "physio", name: "Physiological (simple) anisocoria", short: "Normal variant",
      look: "Difference of 1 mm or less (occasionally up to 2 mm), the same in light and dark, normal reactions, no ptosis. Found in about one in five people.",

      causes: "Normal variant; old photographs often show the same difference.",
      act: "Reassure if everything else is normal.",
      test: "Measure in bright and dim light; ask for old photographs." }

    { id: "parinaud", name: "Dorsal midbrain (Parinaud) syndrome", short: "Upgaze palsy",

    { id: "skew", name: "Skew deviation and central vertigo (HINTS)", short: "Brainstem or cerebellum",

    { id: "tc_sensory", name: "Transcortical sensory aphasia", f: true, c: false, r: true,
      site: "Left temporo-parieto-occipital junction; MCA–PCA watershed.", clues: "Fluent, empty speech and poor understanding, but repeats well (sometimes echoes)." },
    { id: "conduction", name: "Conduction aphasia", f: true, c: true, r: false,
      site: "Left supramarginal gyrus and arcuate fasciculus (posterior perisylvian).", clues: "Fluent speech with sound errors (phonemic paraphasias) and repeated attempts to correct them; understands well; repetition is clearly poor." },
    { id: "anomic", name: "Anomic aphasia", f: true, c: true, r: true,
      site: "Least localizing: angular gyrus, inferior temporal lobe, or any left-hemisphere lesion; also the recovery stage of other aphasias.", clues: "Word-finding pauses and circumlocution; everything else nearly normal. Also seen with tumours, raised ICP and early dementia." }
  ],
  test: [
    ["Is it aphasia?", "Aphasia is a language disorder: speech content, understanding, reading and writing are all affected. Dysarthria is slurred articulation with normal language and normal writing. Confusion is a problem of attention (check orientation, digit span)."],
    ["Fluency", "Listen to conversation or a picture description. Non-fluent: short phrases (usually fewer than 4–5 words), effortful, missing small grammatical words. Fluent: normal phrase length and rhythm, even if the content is wrong."],
    ["Comprehension", "Ask yes/no questions and one-step commands without gesturing ('close your eyes'), then two- and three-step commands ('point to the door, then the ceiling'). Avoid axial commands only (standing up may be preserved)."],
    ["Repetition", "Ask the patient to repeat a short phrase, then a longer sentence, e.g. 'no ifs, ands or buts'."],
    ["Naming", "Name common and less common items: watch, then strap, buckle, hands. Naming is impaired in almost every aphasia, so it helps detect aphasia but not localize it."],
    ["Reading and writing", "Read a sentence aloud and follow a written command; write a sentence. Writing is nearly always affected in true aphasia."],
    ["Dominance", "Language is in the left hemisphere in about 95% of right-handed and about 70% of left-handed people."]
  ]
}
