{ id: "spine-measure", abbr: "SPM", name: "Measuring spinal alignment and deformity", desc: "Cobb angle, sagittal balance, pelvic parameters, cervical and craniocervical lines, slips and instability",
  intro: "How to measure the common radiographic parameters, with usual normal values. Use standing full-length films for alignment; supine CT or MRI underestimates deformity.",
  sections: [
    { h: "Scoliosis (coronal plane)", cards: [
      { t: "Cobb angle", s: "Size of a curve", rows: [
        ["How", "On a standing PA film find the end vertebrae: the most tilted vertebra at the top and at the bottom of the curve. Draw a line along the upper endplate of the upper end vertebra and along the lower endplate of the lower end vertebra. The angle between the two lines (or between lines drawn at right angles to them) is the Cobb angle."],
        ["Meaning", "Scoliosis is a Cobb angle of 10° or more. Measurement error is about 3–5°, so a change of 5° or more is needed to call progression."],
        ["Tip", "Use the same end vertebrae on every follow-up film, and the same film type (standing)."]] },
      { t: "Curve type and apex", s: "Where the curve is", rows: [
        ["Apex", "The vertebra or disc furthest from the midline and most rotated."],
        ["Region", "Thoracic: apex T2 to the T11–12 disc. Thoracolumbar: T12–L1. Lumbar: L1–2 disc to L4."],
        ["Structural", "A curve that stays 25° or more on side-bending films is structural (Lenke); smaller curves that correct are compensatory."]] },
      { t: "Coronal balance", s: "Trunk shift", rows: [
        ["How", "Drop a vertical line from the middle of C7 (C7 plumb line) and draw the central sacral vertical line (CSVL) through the middle of S1. Measure the distance between them."],
        ["Meaning", "More than about 2–3 cm is coronal imbalance."]] },
      { t: "Risser grade", s: "Skeletal maturity", rows: [
        ["How", "Ossification of the iliac crest apophysis on the PA film (US system): 0 none; 1–4 = ossification covering 25%, 50%, 75%, 100% from lateral to medial; 5 = fused to the crest."],
        ["Meaning", "Risser 0–1 (with an open triradiate cartilage) means much growth is left and curves are more likely to progress."]] }
    ]},
    { h: "Sagittal balance and pelvis", cards: [
      { t: "Thoracic kyphosis", s: "T4 (or T5) to T12", rows: [
        ["How", "Cobb angle between the upper endplate of T4 (or T5) and the lower endplate of T12."],
        ["Normal", "About 20–40°; above about 45° is hyperkyphosis. Scheuermann disease: wedging of 5° or more in three or more neighbouring vertebrae."]] },
      { t: "Lumbar lordosis (LL)", s: "L1 to S1", rows: [
        ["How", "Cobb angle between the upper endplate of L1 and the upper endplate of S1."],
        ["Normal", "About 40–60°, and ideally within 10° of the pelvic incidence. About two-thirds of lordosis lies between L4 and S1."]] },
      { t: "Sagittal vertical axis (SVA)", s: "Global balance", rows: [
        ["How", "On a standing lateral film drop a vertical line from the centre of C7 and measure its horizontal distance from the back upper corner of S1. In front of S1 = positive."],
        ["Normal", "Under 4–5 cm. SRS–Schwab grades: 0 under 4 cm; + 4–9.5 cm; ++ over 9.5 cm."],
        ["Tip", "Check the knees and hips: patients compensate by bending the knees and tilting the pelvis back."]], calc: ["srs-schwab", "SRS–Schwab classification"] },
      { t: "Pelvic incidence (PI)", s: "Fixed shape of the pelvis", rows: [
        ["How", "Find the midpoint of the S1 endplate and the centre of the femoral heads (midway between the two heads if they do not overlap). PI is the angle between a line perpendicular to the S1 endplate at its midpoint and a line from that midpoint to the femoral head centre."],
        ["Normal", "Does not change after growth stops. Average about 50° (range roughly 35–85°). PI = PT + SS."]] },
      { t: "Pelvic tilt (PT) and sacral slope (SS)", s: "How the pelvis is positioned", rows: [
        ["PT", "Angle between the vertical and the line from the femoral head centre to the S1 endplate midpoint. High PT means the pelvis is tilted back to compensate for a flat back. SRS–Schwab: 0 under 20°; + 20–30°; ++ over 30°."],
        ["SS", "Angle between the S1 endplate and the horizontal (about 40° on average)."]] },
      { t: "PI–LL mismatch", s: "Is the lordosis right for this pelvis?", rows: [
        ["How", "Subtract lumbar lordosis from pelvic incidence."],
        ["Meaning", "Aim for under 10°. SRS–Schwab: 0 under 10°; + 10–20°; ++ over 20°."]] },
      { t: "T1 pelvic angle (TPA)", s: "Balance not hidden by compensation", rows: [
        ["How", "Angle between the line from the femoral head centre to the centre of T1 and the line from the femoral head centre to the S1 endplate midpoint."],
        ["Meaning", "Combines trunk lean and pelvic tilt, so it is less affected by compensation than SVA. Higher values go with more disability; values around 20° or more are linked with marked disability."]] }
    ]},
    { h: "Cervical spine", cards: [
      { t: "Cervical lordosis (C2–C7)", s: "Cobb method", rows: [
        ["How", "Angle between the lower endplate of C2 and the lower endplate of C7 (or the posterior tangent method along the back of the bodies)."],
        ["Normal", "Wide normal range, usually a modest lordosis. Note any kyphosis before laminectomy or laminoplasty."]] },
      { t: "K-line", s: "Will posterior surgery decompress?", rows: [
        ["How", "On a lateral film or sagittal MRI join the midpoints of the canal at C2 and C7."],
        ["Meaning", "If OPLL or an osteophyte crosses the line (K-line negative), the cord cannot drift back enough after laminoplasty; an anterior or combined approach is usually better."]], calc: ["k-line", "K-line"] },
      { t: "Cervical SVA (C2–C7)", s: "Head forward of the trunk", rows: [
        ["How", "Horizontal distance from a vertical line through the centroid of C2 to the back upper corner of C7."],
        ["Meaning", "More than about 4 cm is linked with worse neck disability."]] },
      { t: "T1 slope and T1S–CL", s: "Cervical deformity", rows: [
        ["How", "T1 slope: angle between the upper endplate of T1 and the horizontal. Subtract the C2–C7 lordosis."],
        ["Meaning", "A mismatch above about 15–20° suggests the neck is not lordotic enough for the thoracic inlet."]] },
      { t: "Chin–brow vertical angle (CBVA)", s: "Horizontal gaze", rows: [
        ["How", "On a standing side photograph with hips and knees straight, the angle between a line from chin to brow and the vertical."],
        ["Meaning", "Close to 0° (about −10° to +10°) allows a comfortable forward gaze; important in ankylosing spondylitis osteotomy planning."]] },
      { t: "Canal size", s: "Stenosis", rows: [
        ["Cervical", "AP canal under 13 mm suggests relative stenosis and under 10 mm absolute stenosis. Torg–Pavlov ratio under 0.8 on plain films."],
        ["Lumbar", "Dural sac area on axial MRI under 100 mm² = relative and under 75 mm² = absolute stenosis; AP diameter under 10 mm = absolute stenosis. Schizas grades A–D describe how much CSF is left around the rootlets."]], calc: ["schizas", "Schizas grade"] }
    ]},
    { h: "Craniocervical junction", cards: [
      { t: "Atlantodental interval (ADI)", s: "Transverse ligament", rows: [
        ["How", "On a lateral film or sagittal CT, the gap between the back of the anterior C1 arch and the front of the dens."],
        ["Normal", "Up to 3 mm in adults and up to 5 mm in children. In rheumatoid arthritis a posterior atlantodental interval (dens to posterior C1 arch) under 14 mm predicts cord compression."]] },
      { t: "Basion–dens and basion–axial intervals", s: "Atlanto-occipital dissociation", rows: [
        ["How", "Basion to dens tip (BDI) and basion to a line along the back of C2 (BAI) on a lateral film."],
        ["Meaning", "On plain films more than 12 mm is abnormal (rule of 12). On CT a BDI above about 8.5–10 mm is suspicious."]], calc: ["powers", "Powers ratio"] },
      { t: "Basilar invagination lines", s: "Dens too high", rows: [
        ["Chamberlain", "Hard palate to opisthion: dens tip more than 3 mm above the line is abnormal."],
        ["McGregor", "Hard palate to the lowest point of the occiput: more than 4.5 mm above is abnormal."],
        ["McRae", "Basion to opisthion (foramen magnum): the dens tip should lie below it."]] },
      { t: "C1 lateral mass overhang", s: "Jefferson fracture", rows: [
        ["How", "On an open-mouth film or coronal CT add the overhang of both C1 lateral masses beyond C2."],
        ["Meaning", "A large combined overhang suggests the transverse ligament has torn."]], calc: ["spence", "Rule of Spence"] }
    ]},
    { h: "Slips, instability and fractures", cards: [
      { t: "Spondylolisthesis grade", s: "Meyerding", rows: [
        ["How", "Percentage slip of the upper vertebra over the length of the lower endplate."],
        ["Grades", "I under 25%; II 25–50%; III 50–75%; IV 75–100%; V over 100% (spondyloptosis). In high-grade slips the slip angle (kyphosis at the slip) also matters."]], calc: ["meyerding", "Meyerding grade"] },
      { t: "Dynamic instability", s: "Flexion–extension films", rows: [
        ["Cervical", "Translation more than 3.5 mm or angulation more than 11° compared with the neighbouring level (White and Panjabi)."],
        ["Lumbar", "Definitions vary; commonly more than 3–4.5 mm of translation or more than 10–15° of angular change. A facet joint effusion on supine MRI suggests a slip may be mobile."]], calc: ["wp-cervical", "White–Panjabi cervical checklist"] },
      { t: "Fracture kyphosis and height loss", s: "Thoracolumbar fractures", rows: [
        ["Kyphosis", "Cobb angle from the upper endplate of the vertebra above to the lower endplate of the vertebra below the fracture."],
        ["Height loss", "Compare the anterior height with the average of the vertebrae above and below."],
        ["Meaning", "Older criteria for instability were height loss over 50%, kyphosis over 25–30° or canal compromise over 50%. Current systems (TLICS, AO) weigh morphology, neurology and posterior ligament injury on MRI."]], calc: ["tlics", "TLICS"] }
    ]}
  ],
  refs: ["Cobb JR. Outline for the study of scoliosis. Instr Course Lect 1948;5:261–275.", "Schwab F, et al. SRS–Schwab adult spinal deformity classification. Spine 2012;37:1077–1082.", "Legaye J, et al. Pelvic incidence: a fundamental pelvic parameter. Eur Spine J 1998;7:99–103.", "Protopsaltis T, et al. The T1 pelvic angle. J Bone Joint Surg Am 2014;96:1631–1640.", "Ames CP, et al. Cervical radiographical alignment. Spine 2013;38(22 Suppl 1):S149–S160.", "Fujiyoshi T, et al. A new concept for making decisions regarding the surgical approach for cervical OPLL: the K-line. Spine 2008;33:E990–E993.", "Tang JA, et al. The impact of standing regional cervical sagittal alignment on outcomes. Neurosurgery 2012;71:662–669.", "Boden SD, et al. Rheumatoid arthritis of the cervical spine. J Bone Joint Surg Am 1993;75:1282–1297.", "Harris JH, et al. Radiologic diagnosis of traumatic occipitovertebral dissociation. AJR 1994;162:881–886.", "Schizas C, et al. Qualitative grading of lumbar spinal stenosis. Spine 2010;35:1919–1924.", "White AA, Panjabi MM. Clinical biomechanics of the spine, 2nd ed. 1990."] },

{ id: "vte", abbr: "VTE", name: "VTE prophylaxis timing after neurosurgery", desc: "When to start leg compression and heparin after craniotomy, TBI, ICH, SAH, spine surgery and spinal cord injury",
  intro: "Mechanical prophylaxis protects without bleeding risk; heparin adds protection once the brain or spine bleeding risk has settled. Most recommendations are based on weak evidence: agree a plan with the operating surgeon.",
  sections: [
    { h: "Principles", cards: [
      { t: "For every patient", s: "Unless the legs are injured or a DVT is present", rows: [
        ["Mechanical", "Intermittent pneumatic compression (IPC) from admission or from the start of surgery. Stockings alone are less effective."],
        ["Drug", "Usual doses: enoxaparin 40 mg SC once daily or unfractionated heparin 5000 units SC every 8–12 h. Adjust for weight and kidney function."],
        ["Before starting", "A stable follow-up CT is commonly used for intracranial bleeds; correct coagulopathy; check platelets."],
        ["Procedures", "By analogy with neuraxial guidance (ASRA): place or remove a drain, catheter or needle at least 12 h after a prophylactic enoxaparin dose and 4–6 h after SC heparin; give the next dose at least 4 h after removal."]], link: ["#drugs/enoxaparin", "Enoxaparin and heparin doses"] }
    ]},
    { h: "Brain", cards: [
      { t: "Elective craniotomy (including tumours)", rows: [
        ["Mechanical", "IPC from the start of surgery."],
        ["Drug", "LMWH or UFH within 24 h after craniotomy (NCS, strong recommendation), usually after a satisfactory post-operative CT."]] },
      { t: "Brain tumour (medical admission)", rows: [
        ["Drug", "LMWH or UFH from admission if the bleeding risk is low and there is no haemorrhage in the tumour (NCS)."]] },
      { t: "Traumatic brain injury", rows: [
        ["Mechanical", "IPC within 24 h of presentation or of craniotomy."],
        ["Drug", "LMWH or UFH within 24–48 h of presentation once the CT is stable, or 24 h after craniotomy (NCS)."],
        ["Risk tiers", "Modified Berne–Norwood (Parkland): low risk (subdural or extradural ≤ 8 mm, contusions ≤ 2 cm, one contusion per lobe, any SAH or IVH) → start 24 h after a stable CT. Moderate risk (anything larger) → start once stable at 48–72 h. High risk (craniotomy or ICP monitor) → individual decision with neurosurgery."]] },
      { t: "Spontaneous intracerebral haemorrhage", rows: [
        ["Mechanical", "IPC from the day of diagnosis (AHA/ASA 2022). Stockings alone do not help."],
        ["Drug", "Low-dose UFH or LMWH at 24–48 h from onset may be reasonable once the haematoma is stable and coagulopathy corrected."]] },
      { t: "Aneurysmal subarachnoid haemorrhage", rows: [
        ["Mechanical", "IPC on admission."],
        ["Drug", "UFH from at least 24 h after the aneurysm is secured by clipping or coiling (NCS, strong recommendation). Time doses around drain insertion and angiography."]] },
      { t: "Ischaemic stroke and decompressive craniectomy", rows: [
        ["Drug", "In immobile stroke patients prophylactic LMWH is preferred to UFH, with IPC. After thrombolysis wait 24 h."],
        ["After surgery", "After hemicraniectomy or thrombectomy, UFH, LMWH and/or IPC can start soon after the procedure (NCS, weak recommendation)."]] },
      { t: "Chronic subdural haematoma (burr holes)", rows: [
        ["Practice", "No specific guideline. IPC from surgery; many units start drug prophylaxis 24–48 h after surgery once the post-operative CT is satisfactory, weighing recurrence risk."]] }
    ]},
    { h: "Spine", cards: [
      { t: "Elective spine surgery", rows: [
        ["Standard", "Early walking with IPC or stockings, with or without LMWH (NCS)."],
        ["Higher risk", "Cancer, previous VTE, long or combined anterior–posterior surgery, poor mobility: add LMWH. UFH only as an alternative because of bleeding risk."],
        ["Timing", "Not fixed by the guideline; many units start 24–48 h after surgery once haemostasis is secure and drain output is low."]] },
      { t: "Spinal cord injury and complex spine surgery", rows: [
        ["Drug", "Start as early as possible, within 72 h of injury, with LMWH (or adjusted-dose UFH) once bleeding is controlled (NCS, strong recommendation)."],
        ["Mechanical", "Do not rely on mechanical measures alone; use IPC if heparin is not possible."],
        ["Filters", "No routine IVC filters; a removable filter only for proven DVT or PE when anticoagulation is impossible."]] }
    ]}
  ],
  refs: ["Nyquist P, et al. Prophylaxis of venous thrombosis in neurocritical care patients (NCS). Neurocrit Care 2016;24:47–60.", "Greenberg SM, et al. 2022 guideline for the management of spontaneous intracerebral hemorrhage (AHA/ASA). Stroke 2022;53:e282–e361.", "Pastorek RA, et al. Prospective validation of a VTE prophylaxis protocol for TBI (Parkland). J Neurotrauma 2014;31:1737–1743.", "Horlocker TT, et al. Regional anesthesia in the patient receiving antithrombotic or thrombolytic therapy (ASRA, 4th ed). Reg Anesth Pain Med 2018;43:263–309."] },

{ id: "brain-death", abbr: "BD", name: "Brain death (death by neurologic criteria)", desc: "Prerequisites, examination, apnea test and ancillary tests as a tick-list (AAN/AAP/CNS/SCCM 2023)",
  intro: "Tick each item as you confirm it. Follows the 2023 US consensus guideline for adults and children; local law and hospital policy decide who may declare death and how it is recorded.",
  sections: [
    { h: "1. Prerequisites", check: true, items: [
      "Known, catastrophic and irreversible cause of coma, consistent with imaging",
      "Waited long enough: at least 24 h after hypoxic–ischaemic injury (e.g. cardiac arrest) in adults and children 24 months or older; at least 48 h after the injury in infants under 24 months",
      "Age at least 37 weeks corrected gestational age",
      "Core temperature 36 °C or higher (if it was 35.5 °C or lower, wait 24 h after rewarming)",
      "Adults: systolic BP 100 mmHg or more and MAP 75 mmHg or more (children: at or above the 5th centile for age)",
      "Sedatives and other CNS depressants cleared: at least 5 half-lives if levels are not available (longer with kidney or liver failure, obesity or recent hypothermia); pentobarbital under 5 µg/mL; alcohol 80 mg/dL or less",
      "No neuromuscular blockade: four twitches on train-of-four, or tendon reflexes present",
      "No severe metabolic, acid–base or endocrine disturbance that could explain the findings"
    ]},
    { h: "2. Neurological examination", check: true, items: [
      "Coma: no eye opening and no motor response to strong pain in the head and limbs (spinal reflexes are allowed)",
      "Pupils do not react to bright light (usually mid-position or dilated)",
      "No corneal reflex on either side",
      "No facial movement to strong pain (supraorbital or jaw-angle pressure)",
      "No oculocephalic reflex (do not test if the cervical spine or skull base may be injured)",
      "No oculovestibular reflex on both sides (common practice: head up 30°, 50 mL ice water in each ear, watch for at least 1 minute, wait about 5 minutes between ears)",
      "No gag reflex",
      "No cough to deep tracheal suction",
      "Infants: no sucking or rooting reflex"
    ]},
    { h: "3. Apnea test", check: true, items: [
      "Pre-oxygenate with 100% oxygen for at least 10 minutes (PaO₂ above 200 mmHg)",
      "Baseline blood gas: PaCO₂ 35–45 mmHg and pH 7.35–7.45 (or the patient's known chronic baseline); not hypoxic, hypotensive or hypovolaemic",
      "Disconnect from the ventilator with oxygen delivered to the trachea; watch the chest and abdomen for any breathing",
      "Repeat blood gas after 8–10 minutes",
      "Consistent with brain death: no breathing, pH below 7.30 and PaCO₂ 60 mmHg or more and at least 20 mmHg above baseline",
      "Stop and reconnect if: any breath; SBP below 100 or MAP below 75 despite treatment (children: below the 5th centile); SpO₂ falling below 85%; unstable arrhythmia. Then use an ancillary test"
    ]},
    { h: "4. How many examinations", cards: [
      { t: "Adults", rows: [["Exams", "One complete examination and one apnea test after it. A second independent examination is optional."]] },
      { t: "Infants and children", rows: [["Exams", "Two examinations by two different attending clinicians at least 12 h apart, each followed by an apnea test."]] }
    ]},
    { h: "5. Ancillary tests", cards: [
      { t: "When to use", rows: [["Use", "Only when part of the examination or the apnea test cannot be completed safely, or a finding is uncertain. Not to shortcut hypothermia or high sedative levels."]] },
      { t: "Acceptable", rows: [["Tests", "Four-vessel catheter angiography; radionuclide perfusion scintigraphy (SPECT with a blood–brain barrier-crossing agent) or planar radionuclide angiography; transcranial Doppler in adults only."]] },
      { t: "Not acceptable", rows: [["Tests", "EEG, evoked potentials, CT angiography, MRI or MR angiography."]] }
    ]},
    { h: "Notes", cards: [
      { t: "Movements that do not exclude brain death", rows: [["Spinal reflexes", "Triple flexion, finger jerks, undulating toe movements, the Lazarus sign and sweating or blushing can occur with brain death; they come from the spinal cord."]] },
      { t: "Family", rows: [["Communication", "Explain the process beforehand; families may be offered the chance to be present during the examination."]] }
    ]}
  ],
  refs: ["Greer DM, et al. Pediatric and adult brain death/death by neurologic criteria consensus guideline (AAN/AAP/CNS/SCCM). Neurology 2023;101:1112–1132.", "Wijdicks EFM, et al. Evidence-based guideline update: determining brain death in adults. Neurology 2010;74:1911–1918."] },
{ id: "admissions", abbr: "ADM", name: "Common admissions: the first hours", desc: "Head injury, chronic subdural, SAH, ICH, spinal cord injury, cauda equina, cord compression, tumour with oedema, spinal infection, shunt failure",
  intro: "A short checklist for the admitting doctor: what to assess, what to order, which targets to hold and when to call the senior. Adapt to your unit's protocols.",
  sections: [
    { h: "Brain", cards: [
      { t: "Traumatic brain injury (moderate or severe)", s: "BTF 4th edition", rows: [
        ["Assess", "ABCDE with spinal precautions; GCS (record the best motor score) and pupils; focal signs; glucose; CT head and cervical spine; coagulation and antithrombotic drugs."],
        ["Orders", "Neuro observations hourly at least; head up 30° with the neck straight (loosen a tight collar); analgesia and sedation; antiseizure prophylaxis for 7 days in severe TBI; reverse anticoagulants; IPC; heparin once the CT is stable."],
        ["Targets", "Avoid hypotension: SBP 100 mmHg or more at age 50–69 and 110 or more at 15–49 or over 70. Avoid hypoxia. PaCO₂ 35–45. Treat ICP above 22 mmHg; CPP 60–70. Normal sodium and temperature."],
        ["Escalate", "GCS falls by 2 or more (or motor by 1), new pupil difference, new weakness, seizure, persistent vomiting or worsening headache: repeat CT and call the senior."],
        ["Avoid", "Steroids (harmful in CRASH); hypotonic fluids and albumin; prophylactic hyperventilation."]], calc: ["gcs", "GCS"], link: ["#guide/vte/1-2", "VTE timing in TBI"] },
      { t: "Chronic subdural haematoma", rows: [
        ["Assess", "Conscious level, speech, weakness, gait; falls history; antiplatelets and anticoagulants; platelets, INR, sodium; CT."],
        ["Orders", "Hold antithrombotics and reverse before surgery; correct sodium; burr-hole drainage with a subdural drain for symptomatic collections; where available, middle meningeal artery embolization lowers recurrence after surgery (EMBOLISE)."],
        ["Escalate", "Falling GCS, pupil change, seizures."],
        ["Avoid", "Routine dexamethasone: worse outcomes in Dex-CSDH."]], calc: ["markwalder", "Markwalder grade"] },
      { t: "Aneurysmal subarachnoid haemorrhage", s: "AHA/ASA 2023, NCS 2023", rows: [
        ["Assess", "WFNS or Hunt–Hess grade; CT and CT angiography; ECG and troponin; sodium; hydrocephalus on CT."],
        ["Orders", "Secure the aneurysm early, preferably within 24 h; nimodipine 60 mg every 4 h for 21 days; EVD for symptomatic hydrocephalus; keep euvolaemia and avoid large swings in blood pressure (many units keep SBP under 160 until the aneurysm is secured); IPC, then heparin 24 h after securing."],
        ["Watch", "Rebleeding (first hours), hydrocephalus, delayed cerebral ischaemia between days 3 and 14 (new deficit or fall in GCS), low sodium (do not fluid-restrict), seizures."],
        ["Avoid", "Prophylactic hypervolaemia ('triple H'); routine prophylactic antiseizure drugs; routine tranexamic acid (no benefit in ULTRA); routine statins or magnesium."]], calc: ["wfns", "WFNS grade"], link: ["#drugs/nimodipine", "Nimodipine dosing"] },
      { t: "Spontaneous intracerebral haemorrhage", s: "AHA/ASA 2022", rows: [
        ["Assess", "GCS and ICH score; CT and CT angiography (spot sign, vascular cause); coagulation and antithrombotic drugs; glucose."],
        ["Orders", "If SBP is 150–220, lower it promptly to about 140 mmHg (keep it above 130) and keep it steady; reverse anticoagulants; IPC from day one; EVD for hydrocephalus; cerebellar haemorrhage with deterioration, brainstem compression, hydrocephalus or volume of 15 mL or more → surgical evacuation; selected lobar clots → minimally invasive evacuation (ENRICH)."],
        ["Avoid", "Platelet transfusion for antiplatelet use unless surgery is planned (PATCH); prophylactic antiseizure drugs; steroids for oedema; SBP below 130."]], calc: ["ich", "ICH score"], link: ["#drugs/reversal", "Reversal of antithrombotics"] },
      { t: "Brain tumour with oedema", rows: [
        ["Assess", "GCS, focal signs, seizures; MRI with contrast; think of lymphoma (periventricular, enhancing) and abscess."],
        ["Orders", "Dexamethasone only for symptomatic oedema, at the lowest effective dose, with PPI and glucose checks; delay steroids before biopsy when lymphoma is suspected; antiseizure drugs only after a seizure (no prophylaxis in seizure-free patients); VTE prophylaxis; multidisciplinary review."],
        ["Escalate", "Drowsiness or vomiting (posterior fossa tumours can block CSF flow: check for hydrocephalus)."]], link: ["#drugs/dexamethasone", "Dexamethasone dosing"] },
      { t: "Shunt malfunction or infection", rows: [
        ["Assess", "Headache, vomiting, drowsiness, irritability; bulging fontanelle or sunsetting eyes in infants; sixth nerve palsy, papilloedema; fever, red track, abdominal pain. Compare the CT or fast MRI with old scans (ventricles may not enlarge); shunt series X-ray."],
        ["Orders", "Urgent neurosurgical review; nil by mouth; shunt tap by the neurosurgeon for pressure and CSF; suspected infection: remove the shunt, place an EVD and start vancomycin plus an anti-pseudomonal β-lactam."],
        ["Escalate", "Falling GCS is an emergency: CSF may need to be drained from the reservoir or by an EVD at once."]], link: ["#drugs/vancomycin", "Antibiotic doses"] }
    ]},
    { h: "Spine", cards: [
      { t: "Acute spinal cord injury", s: "AO Spine/Praxis 2024", rows: [
        ["Assess", "ISNCSCI (ASIA) examination including sacral sparing; level; neurogenic shock (low BP with slow pulse); breathing (cervical injuries: measure vital capacity); CT of the whole spine, then MRI."],
        ["Orders", "Spinal precautions; MAP at least 75–80 and not above 90–95 mmHg for 3–7 days; decompression within 24 h of injury where feasible; bladder catheter; bowel care; turn every 2 h; VTE prophylaxis within 72 h."],
        ["Escalate", "Rising level, falling vital capacity (cervical injuries can tire over hours), new instability."],
        ["Note", "High-dose methylprednisolone is not routine; a 24-h course started within 8 h is only an option in some guidelines."]], calc: ["ais", "ASIA impairment scale"], link: ["#loc/C5", "Roots and myotomes"] },
      { t: "Cauda equina syndrome", rows: [
        ["Assess", "Bilateral or alternating sciatica, saddle numbness, new bladder difficulty or retention, bowel or sexual change; perianal sensation and anal tone; post-void bladder scan."],
        ["Orders", "Emergency MRI at any hour; urgent decompression when confirmed. Aim to operate before retention develops: outcomes are much better in the incomplete stage."],
        ["Avoid", "Waiting for retention or for the morning list."]] },
      { t: "Metastatic spinal cord compression", s: "NICE 2023", rows: [
        ["Assess", "Known or suspected cancer with spinal pain, weakness, sensory level or sphincter change; MRI of the whole spine immediately if neurological signs."],
        ["Orders", "Dexamethasone 16 mg/day with PPI and glucose checks; flat bed and log-roll if pain on movement or instability is suspected; urgent spinal and oncology review; surgery plus radiotherapy for selected patients (Patchell), otherwise radiotherapy."]], calc: ["sins", "SINS"], link: ["#drugs/dexamethasone", "Dexamethasone dosing"] },
      { t: "Spinal infection (discitis or epidural abscess)", s: "IDSA 2015", rows: [
        ["Assess", "Back pain with fever or raised CRP; diabetes, injecting drug use, recent bacteraemia or procedure; neurological examination; MRI with contrast; two sets of blood cultures."],
        ["Orders", "Stable and neurologically intact: hold antibiotics until cultures or a CT-guided biopsy are taken. Sepsis or neurological deficit: start empirical antibiotics at once (cover MRSA and Gram-negatives). Abscess with deficit: urgent decompression. Echocardiography for S. aureus bacteraemia. Usually 6 weeks of antibiotics."]], link: ["#drugs/vancomycin", "Antibiotic doses"] }
    ]}
  ],
  refs: ["Carney N, et al. Guidelines for the management of severe TBI, 4th ed. Neurosurgery 2017;80:6–15.", "Hoh BL, et al. 2023 guideline for the management of aneurysmal subarachnoid hemorrhage (AHA/ASA). Stroke 2023;54:e314–e370.", "Treggiari MM, et al. Guidelines for the neurocritical care management of aSAH (NCS). Neurocrit Care 2023;39:1–28.", "Greenberg SM, et al. 2022 guideline for spontaneous intracerebral hemorrhage (AHA/ASA). Stroke 2022;53:e282–e361.", "Kwon BK, et al. AO Spine/Praxis guideline on hemodynamic management of acute SCI. Global Spine J 2024;14(3S):187S–211S.", "Fehlings MG, et al. Guideline on timing of decompression in acute SCI. Global Spine J 2024;14(3S).", "National Institute for Health and Care Excellence. Spinal metastases and metastatic spinal cord compression (NG234), 2023.", "Berbari EF, et al. IDSA guidelines for native vertebral osteomyelitis. Clin Infect Dis 2015;61:e26–e46.", "Tunkel AR, et al. IDSA guidelines for healthcare-associated ventriculitis and meningitis. Clin Infect Dis 2017;64:e34–e65."] },

{ id: "postop", abbr: "POP", name: "After common neurosurgical operations", desc: "First-day orders, warning signs and discharge advice: craniotomy, burr holes, shunt, EVD, transsphenoidal, discectomy, fusion, ACDF",
  intro: "Typical ward care and patient advice after common operations. Times are usual practice and vary between surgeons; follow your unit's instructions.",
  sections: [
    { h: "Cranial", cards: [
      { t: "Craniotomy (tumour or haematoma)", rows: [
        ["First 24 h", "Neuro observations hourly; head up 30°; blood pressure target from the surgeon (often SBP under 160); continue antiseizure drug if started; dexamethasone taper for tumours with PPI and glucose checks; sodium daily; paracetamol with an opioid if needed; antiemetic; IPC, then heparin from 24 h; early mobilisation."],
        ["Warning signs", "Fall in GCS, new weakness or speech problem, seizure: urgent CT (haematoma, oedema, infarct). Clear fluid from the wound or nose (CSF leak). Fever with neck stiffness. Low sodium (SIADH or salt wasting)."],
        ["Discharge advice", "Keep the wound dry for 2–3 days, then wash gently; clips or stitches out at 7–10 days (later after radiotherapy or on steroids); no heavy lifting or straining for about 4–6 weeks; no swimming until healed; driving only when cleared (after a seizure follow national rules); ask before flying."],
        ["Return at once if", "Worsening headache, repeated vomiting, drowsiness or confusion, new weakness, seizure, fever, redness, swelling or discharge from the wound."]] },
      { t: "Burr holes for chronic subdural haematoma", rows: [
        ["First 24 h", "Subdural drain closed and at or below head level, usually removed at 24–48 h; hydration; mobilise once the drain is out (long flat bed rest is not needed); watch sodium and glucose."],
        ["Warning signs", "Confusion, seizures, new weakness (recollection, tension pneumocephalus, acute bleed)."],
        ["Discharge advice", "Recurrence occurs in about 1 in 10: return if headache, confusion, weakness or unsteadiness come back. Fall prevention at home; limit alcohol. Restarting antiplatelets or anticoagulants is an individual decision with the team."]] },
      { t: "Ventriculoperitoneal shunt", rows: [
        ["First 24 h", "Neuro observations; post-operative CT or shunt series as per unit; abdominal pain and ileus; wound checks; mobilise."],
        ["Warning signs", "Blockage: headache, vomiting, drowsiness, bulging fontanelle or sunsetting eyes. Overdrainage: headache worse on sitting up, subdural collections. Infection (mostly in the first months): fever, red track, abdominal pain, wound breakdown."],
        ["Discharge advice", "Know the valve type and setting; programmable valves must be checked after MRI and kept away from strong magnets; carry a shunt card; normal activities once the wound heals."],
        ["Return at once if", "Signs of blockage or infection: same-day assessment."]] },
      { t: "External ventricular drain (EVD)", rows: [
        ["Set-up", "Zero at the tragus (level of the foramen of Monro); chamber height as ordered; record output hourly; clamp before moving the patient or the head of the bed, and unclamp afterwards."],
        ["Daily", "CSF colour and volume; check the drain swings with the pulse; sample CSF only when clinically needed, with full asepsis; never flush towards the patient."],
        ["Warning signs", "No output or no swing (blocked or clamped), sudden high output (overdrainage), fall in GCS, fever or cloudy CSF (ventriculitis)."],
        ["Removal", "Often after a clamp trial of about 24 h with clinical checks (CT if any concern); stitch the exit site and watch for CSF leak."]], link: ["#guide/vte/0-0", "Timing heparin around drain removal"] },
      { t: "Transsphenoidal pituitary surgery", rows: [
        ["First days", "Strict fluid balance with hourly urine output; sodium twice daily for the first 2 days, then daily to about day 7–10; steroid cover per endocrine protocol; vision checks."],
        ["Warning signs", "Diabetes insipidus (large volumes of dilute urine with rising sodium) in the first days; low sodium from SIADH around days 5–9; clear salty nasal drip worse on leaning forward (CSF leak, test for β2-transferrin); falling vision (haematoma: emergency); nosebleed."],
        ["Discharge advice", "No nose blowing, straws, heavy lifting or straining for 2–4 weeks; sneeze with the mouth open; sodium check about a week after surgery; steroid sick-day rules if on hydrocortisone; endocrine follow-up at about 6 weeks."]] }
    ]},
    { h: "Spine", cards: [
      { t: "Lumbar microdiscectomy", rows: [
        ["First 24 h", "Walk the same day; check leg strength and bladder function; simple analgesia; usually home the same or next day."],
        ["Warning signs", "New weakness, saddle numbness or urinary retention (epidural haematoma or recurrent disc compressing the cauda equina): emergency MRI. Wound leak (dural tear). Severe back pain 2–6 weeks later with raised CRP (discitis)."],
        ["Discharge advice", "Walk daily and build up; avoid heavy lifting and repeated bending for the first few weeks (evidence for strict limits is weak); desk work often after 2–4 weeks; about 1 in 10 have a recurrent herniation."],
        ["Return at once if", "New weakness, numbness between the legs, bladder or bowel problems, fever or wound discharge."]] },
      { t: "Lumbar decompression and fusion", rows: [
        ["First 24 h", "Leg neurology every 1–4 h; drain output; haemoglobin; mobilise from day 1 with physiotherapy; remove the urinary catheter early; bowel care with opioids; VTE plan."],
        ["Warning signs", "New or progressive weakness (epidural haematoma: emergency MRI and theatre); new radicular pain (screw position); wound leak or infection; ileus."],
        ["Discharge advice", "Avoid heavy lifting, twisting and long sitting for about 6–12 weeks; stop smoking (non-union); brace only if prescribed; X-ray at follow-up."]] },
      { t: "Anterior cervical discectomy and fusion (ACDF)", rows: [
        ["First 24 h", "Watch neck swelling, voice, swallowing and breathing: an expanding haematoma can close the airway (call for help; opening the wound at the bedside can be life-saving); head up; limb neurology."],
        ["Warning signs", "Swallowing difficulty (common, usually settles), hoarse voice (recurrent laryngeal nerve), C5 palsy (shoulder weakness after 1–3 days), fever with neck pain or crepitus (oesophageal injury)."],
        ["Discharge advice", "Collar only if prescribed; soft food if swallowing is uncomfortable; no heavy lifting for a few weeks; drive when able to turn the head and off strong painkillers."],
        ["Return at once if", "Breathing difficulty, rapidly worsening swallowing, neck swelling, fever, new weakness."]] },
      { t: "Posterior cervical surgery and Chiari decompression", rows: [
        ["Warning signs", "C5 palsy, wound infection (higher than anterior surgery), pseudomeningocele or CSF leak; after Chiari decompression, aseptic meningitis (headache, fever, neck stiffness around 1–2 weeks) and hydrocephalus."],
        ["Discharge advice", "Neck exercises as advised by physiotherapy; wound care as for other spine surgery."]] },
      { t: "Carpal tunnel release", rows: [
        ["Advice", "Keep the hand raised for 2–3 days; move the fingers from day one; stitches out at 10–14 days; avoid heavy gripping for 2–4 weeks; night tingling usually improves quickly, wasting more slowly."],
        ["Return if", "Increasing pain, redness or discharge, worse numbness."]] }
    ]}
  ],
  refs: ["Santarius T, et al. Use of drains versus no drains after burr-hole evacuation of chronic subdural haematoma. Lancet 2009;374:1067–1073.", "Fried HI, et al. The insertion and management of external ventricular drains (NCS consensus). Neurocrit Care 2016;24:61–81.", "Hensen J, et al. Prevalence, predictors and patterns of postoperative polyuria and hyponatraemia after transsphenoidal surgery. Clin Endocrinol 1999;50:431–439.", "Unit protocols and textbook practice (Greenberg, Handbook of Neurosurgery)."] },

{ id: "trials", abbr: "RCT", name: "Landmark papers in neurosurgery", desc: "Short, plain summaries of the trials every resident should know: trauma, vascular, spine, oncology, hydrocephalus, epilepsy",
  intro: "Each card gives the question, the main result and what it changed. Numbers are rounded; read the original paper before quoting it in a presentation.",
  sections: [
    { h: "Head injury", cards: [
      { t: "CRASH (2004)", s: "Steroids after head injury", rows: [["Question", "Does methylprednisolone help adults with head injury?"], ["Result", "About 10,000 patients. Death at 2 weeks was higher with steroids (21% vs 18%)."], ["Take-home", "Do not give steroids for TBI."], ["Paper", "CRASH trial collaborators. Lancet 2004;364:1321–1328."]] },
      { t: "CRASH-3 (2019)", s: "Tranexamic acid in TBI", rows: [["Question", "Does TXA within 3 h of injury reduce head-injury death?"], ["Result", "About 12,700 patients. Overall no significant reduction; fewer head-injury deaths in mild to moderate TBI, especially when given early; no excess of clots."], ["Take-home", "Give TXA early (within 3 h) in mild–moderate TBI where protocols allow."], ["Paper", "CRASH-3 collaborators. Lancet 2019;394:1713–1723."]] },
      { t: "DECRA (2011)", s: "Early bifrontal craniectomy", rows: [["Question", "Does early bifrontal decompressive craniectomy improve outcome in diffuse TBI with moderately raised ICP?"], ["Result", "155 patients (ICP above 20 for 15 minutes). Lower ICP and shorter ICU stay, but more unfavourable outcomes at 6 months (70% vs 51%)."], ["Take-home", "Early, liberal bifrontal craniectomy for modest ICP rises is not helpful."], ["Paper", "Cooper DJ, et al. N Engl J Med 2011;364:1493–1502."]] },
      { t: "RESCUEicp (2016)", s: "Craniectomy for refractory ICP", rows: [["Question", "Last-tier craniectomy versus medical care for ICP above 25 mmHg despite treatment."], ["Result", "408 patients. Mortality at 6 months fell (27% vs 49%) but more survivors were vegetative or severely disabled; at 12 months more patients reached upper severe disability or better."], ["Take-home", "Craniectomy saves lives in refractory ICP; discuss the likely level of disability with families."], ["Paper", "Hutchinson PJ, et al. N Engl J Med 2016;375:1119–1130."]] },
      { t: "RESCUE-ASDH (2023)", s: "Craniotomy or craniectomy for acute subdural", rows: [["Question", "Should the bone flap be replaced after evacuating an acute subdural haematoma?"], ["Result", "450 patients. Similar 12-month outcomes (death about 30% vs 32%). More repeat surgery within 2 weeks after craniotomy (15% vs 7%); more wound complications after craniectomy."], ["Take-home", "Replace the flap when the brain allows; leave it out if the brain is swollen."], ["Paper", "Hutchinson PJ, et al. N Engl J Med 2023;388:2219–2229."]] },
      { t: "BEST:TRIP (2012)", s: "ICP monitoring", rows: [["Question", "Does treatment guided by an ICP monitor beat treatment guided by imaging and examination?"], ["Result", "324 patients in South America: no difference in outcome at 6 months."], ["Take-home", "The protocol matters more than the monitor; where monitors are scarce, a structured imaging and clinical protocol is reasonable."], ["Paper", "Chesnut RM, et al. N Engl J Med 2012;367:2471–2481."]] },
      { t: "Temkin (1990)", s: "Seizure prophylaxis after TBI", rows: [["Question", "Does phenytoin prevent seizures after severe TBI?"], ["Result", "Early seizures (first week) fell from 14% to 4%; late seizures were not prevented."], ["Take-home", "Give prophylaxis for 7 days only."], ["Paper", "Temkin NR, et al. N Engl J Med 1990;323:497–502."]] },
      { t: "SAFE-TBI (2007)", s: "Albumin in TBI", rows: [["Question", "Is albumin as safe as saline for resuscitation in TBI?"], ["Result", "Higher mortality at 2 years with albumin (33% vs 20%)."], ["Take-home", "Use isotonic crystalloid, not albumin, in TBI."], ["Paper", "SAFE Study Investigators. N Engl J Med 2007;357:874–884."]] },
      { t: "Eurotherm3235 (2015) and POLAR (2018)", s: "Hypothermia", rows: [["Question", "Does induced hypothermia improve TBI outcome?"], ["Result", "No benefit; in Eurotherm (hypothermia for raised ICP) outcomes were worse."], ["Take-home", "Aim for normal temperature; do not cool to treat ICP routinely."], ["Paper", "Andrews PJD, et al. N Engl J Med 2015;373:2403–2412. Cooper DJ, et al. JAMA 2018;320:2211–2220."]] }
    ]},
    { h: "Vascular", cards: [
      { t: "ISAT (2002)", s: "Coiling vs clipping", rows: [["Question", "For ruptured aneurysms suitable for both, coil or clip?"], ["Result", "2143 patients. Death or dependency at 1 year 24% after coiling vs 31% after clipping; late rebleeding slightly more common after coiling."], ["Take-home", "Coil when both are possible; clipping remains essential for many aneurysms (e.g. MCA, large haematoma)."], ["Paper", "Molyneux A, et al. Lancet 2002;360:1267–1274."]] },
      { t: "British nimodipine trial (1989)", s: "Nimodipine after SAH", rows: [["Question", "Does oral nimodipine help after SAH?"], ["Result", "554 patients. Cerebral infarction 22% vs 33%; poor outcome 20% vs 33%."], ["Take-home", "Oral nimodipine 60 mg every 4 h for 21 days for all aSAH patients."], ["Paper", "Pickard JD, et al. BMJ 1989;298:636–642."]], link: ["#drugs/nimodipine", "Nimodipine dosing"] },
      { t: "ISUIA (2003)", s: "Unruptured aneurysm risk", rows: [["Question", "How often do unruptured aneurysms bleed?"], ["Result", "5-year rupture risk rose with size and location: anterior circulation under 7 mm (no previous SAH) close to 0%, 7–12 mm about 3%, 13–24 mm about 15%, 25 mm or more about 40%; posterior circulation and PCOM higher at every size."], ["Take-home", "Size and location drive the risk; weigh against treatment risk (see PHASES)."], ["Paper", "Wiebers DO, et al. Lancet 2003;362:103–110."]], calc: ["phases", "PHASES score"] },
      { t: "ARUBA (2014)", s: "Unruptured brain AVMs", rows: [["Question", "Treat unruptured AVMs or manage medically?"], ["Result", "Stopped early: death or stroke 10% with medical management vs 31% with intervention."], ["Take-home", "Many unruptured AVMs can be observed; the trial is debated because of mixed and often non-surgical treatments."], ["Paper", "Mohr JP, et al. Lancet 2014;383:614–621."]], calc: ["spetzler-martin", "Spetzler–Martin grade"] },
      { t: "STICH (2005) and STICH II (2013)", s: "Surgery for supratentorial ICH", rows: [["Question", "Does early craniotomy improve outcome in spontaneous ICH?"], ["Result", "No overall benefit in STICH; in STICH II (superficial lobar clots without IVH) a small, non-significant advantage."], ["Take-home", "Routine craniotomy is not superior; operate for deterioration or selected superficial clots."], ["Paper", "Mendelow AD, et al. Lancet 2005;365:387–397; Lancet 2013;382:397–408."]] },
      { t: "MISTIE III (2019)", s: "Catheter plus alteplase for ICH", rows: [["Question", "Does minimally invasive drainage with alteplase improve function?"], ["Result", "No overall improvement in good outcome at 1 year; benefit when the residual clot was 15 mL or less."], ["Take-home", "If you evacuate, remove as much clot as possible."], ["Paper", "Hanley DF, et al. Lancet 2019;393:1021–1032."]] },
      { t: "ENRICH (2024)", s: "Minimally invasive surgery for ICH", rows: [["Question", "Does early minimally invasive parafascicular evacuation (30–80 mL, within 24 h) help?"], ["Result", "300 patients. Better utility-weighted mRS at 180 days (0.458 vs 0.374), driven by lobar haemorrhages; no clear benefit for basal ganglia clots."], ["Take-home", "Early minimally invasive evacuation is an option for lobar ICH in experienced centres."], ["Paper", "Pradilla G, et al. N Engl J Med 2024;390:1277–1289."]] },
      { t: "CLEAR III (2017)", s: "Intraventricular alteplase", rows: [["Question", "Does alteplase through an EVD improve IVH outcome?"], ["Result", "No improvement in good functional outcome; lower mortality but more severely disabled survivors."], ["Take-home", "Not routine; may help selected patients with large IVH."], ["Paper", "Hanley DF, et al. Lancet 2017;389:603–611."]] },
      { t: "DECIMAL, DESTINY, HAMLET pooled (2007) and DESTINY II (2014)", s: "Hemicraniectomy for malignant MCA infarct", rows: [["Question", "Does early decompressive hemicraniectomy help?"], ["Result", "Age 60 or under, within 48 h: survival 78% vs 29% and more patients with mRS 0–3. Over 60 (DESTINY II): better survival and more mRS 0–4, but no survivor was independent."], ["Take-home", "Offer early hemicraniectomy; discuss expected disability, especially in older patients."], ["Paper", "Vahedi K, et al. Lancet Neurol 2007;6:215–222. Jüttler E, et al. N Engl J Med 2014;370:1091–1100."]] },
      { t: "MR CLEAN (2015) and DAWN (2018)", s: "Thrombectomy", rows: [["Question", "Does thrombectomy help large-vessel occlusion stroke?"], ["Result", "MR CLEAN (within 6 h): independence 33% vs 19%. DAWN (6–24 h with clinical–imaging mismatch): 49% vs 13%."], ["Take-home", "Refer large-vessel occlusion urgently for thrombectomy, up to 24 h in selected patients."], ["Paper", "Berkhemer OA, et al. N Engl J Med 2015;372:11–20. Nogueira RG, et al. N Engl J Med 2018;378:11–21."]] }
    ]},
    { h: "Chronic subdural haematoma", cards: [
      { t: "Santarius drain trial (2009)", s: "Drain after burr holes", rows: [["Question", "Does a subdural drain reduce recurrence?"], ["Result", "Recurrence 9% with a drain vs 24% without; lower mortality at 6 months."], ["Take-home", "Leave a drain after burr-hole evacuation."], ["Paper", "Santarius T, et al. Lancet 2009;374:1067–1073."]] },
      { t: "Dex-CSDH (2020)", s: "Dexamethasone", rows: [["Question", "Does dexamethasone improve outcome?"], ["Result", "Fewer repeat operations, but fewer favourable outcomes and more adverse events with dexamethasone."], ["Take-home", "Do not use dexamethasone routinely."], ["Paper", "Hutchinson PJ, et al. N Engl J Med 2020;383:2616–2627."]] },
      { t: "EMBOLISE (2024)", s: "Middle meningeal artery embolization", rows: [["Question", "Does adding MMA embolization to surgery reduce re-operation?"], ["Result", "400 patients. Recurrence or progression needing surgery within 90 days 4% vs 11%."], ["Take-home", "Consider adjunctive MMA embolization where available."], ["Paper", "Davies JM, et al. N Engl J Med 2024;391:1890–1900."]] }
    ]},
    { h: "Spine", cards: [
      { t: "SPORT disc herniation (2006)", s: "Surgery vs non-operative care", rows: [["Question", "Discectomy or non-operative care for sciatica from a disc?"], ["Result", "By intention to treat both groups improved with no significant difference (many crossed over); patients treated surgically improved faster and more."], ["Take-home", "Both are reasonable; surgery gives faster relief."], ["Paper", "Weinstein JN, et al. JAMA 2006;296:2441–2450 and 2451–2459."]] },
      { t: "Peul (2007)", s: "Timing of sciatica surgery", rows: [["Question", "Early surgery or prolonged conservative care for 6–12 weeks of sciatica?"], ["Result", "Faster recovery with early surgery (about 4 vs 12 weeks) but similar results at 1 year; 39% of the conservative group had surgery."], ["Take-home", "Without red flags, waiting is safe; surgery speeds recovery."], ["Paper", "Peul WC, et al. N Engl J Med 2007;356:2245–2256."]] },
      { t: "SLIP (2016) and Swedish Spinal Stenosis Study (2016)", s: "Fusion for stenosis", rows: [["Question", "Should fusion be added to decompression?"], ["Result", "SLIP (grade I degenerative slip): better physical health scores and fewer re-operations with fusion (14% vs 34%). Swedish study: no added benefit of fusion, even with a slip, at higher cost."], ["Take-home", "Fuse selectively: instability, mobile slips, deformity or extensive decompression."], ["Paper", "Ghogawala Z, et al. N Engl J Med 2016;374:1424–1434. Försth P, et al. N Engl J Med 2016;374:1413–1423."]] },
      { t: "Patchell (2005)", s: "Surgery for metastatic cord compression", rows: [["Question", "Surgery plus radiotherapy or radiotherapy alone?"], ["Result", "Walking after treatment 84% vs 57%; walking ability kept for a median 122 vs 13 days; more non-walkers regained walking (62% vs 19%)."], ["Take-home", "Decompress and stabilise selected patients, then irradiate."], ["Paper", "Patchell RA, et al. Lancet 2005;366:643–648."]], calc: ["sins", "SINS"] },
      { t: "STASCIS (2012)", s: "Timing of decompression in SCI", rows: [["Question", "Is decompression within 24 h better for cervical SCI?"], ["Result", "Improvement of at least 2 ASIA grades in 20% vs 9%."], ["Take-home", "Decompress within 24 h when feasible."], ["Paper", "Fehlings MG, et al. PLoS One 2012;7:e32037."]] },
      { t: "NASCIS II (1990)", s: "Methylprednisolone in SCI", rows: [["Question", "Does high-dose methylprednisolone improve recovery?"], ["Result", "No benefit in the main analysis; a small motor gain in a subgroup treated within 8 h; more infections and complications."], ["Take-home", "Not routine; at most a 24-h course started within 8 h after discussion."], ["Paper", "Bracken MB, et al. N Engl J Med 1990;322:1405–1411."]] }
    ]},
    { h: "Tumours", cards: [
      { t: "Stupp (2005)", s: "Temozolomide for glioblastoma", rows: [["Question", "Radiotherapy with or without temozolomide?"], ["Result", "Median survival 14.6 vs 12.1 months; 2-year survival 27% vs 10%; most benefit with MGMT promoter methylation."], ["Take-home", "Standard care after surgery: radiotherapy with concurrent and adjuvant temozolomide."], ["Paper", "Stupp R, et al. N Engl J Med 2005;352:987–996."]] },
      { t: "5-ALA (2006)", s: "Fluorescence-guided resection", rows: [["Question", "Does 5-ALA fluorescence increase resection of malignant glioma?"], ["Result", "Complete resection of enhancing tumour 65% vs 36%; 6-month progression-free survival 41% vs 21%."], ["Take-home", "Extent of resection matters; fluorescence helps achieve it."], ["Paper", "Stummer W, et al. Lancet Oncol 2006;7:392–401."]] },
      { t: "RTOG 9802 (2016)", s: "Low-grade glioma", rows: [["Question", "Radiotherapy with or without PCV chemotherapy for high-risk low-grade glioma?"], ["Result", "Median survival 13.3 vs 7.8 years with added PCV."], ["Take-home", "Add chemotherapy to radiotherapy for high-risk low-grade glioma."], ["Paper", "Buckner JC, et al. N Engl J Med 2016;374:1344–1355."]] },
      { t: "INDIGO (2023)", s: "Vorasidenib for IDH-mutant glioma", rows: [["Question", "Does an IDH inhibitor delay progression after surgery alone?"], ["Result", "Progression-free survival 27.7 vs 11.1 months."], ["Take-home", "An option to delay radiotherapy and chemotherapy in residual or recurrent grade 2 IDH-mutant glioma."], ["Paper", "Mellinghoff IK, et al. N Engl J Med 2023;389:589–601."]] },
      { t: "Patchell (1990)", s: "Surgery for a single brain metastasis", rows: [["Question", "Resection plus whole-brain radiotherapy or radiotherapy alone?"], ["Result", "Local recurrence 20% vs 52%; survival 40 vs 15 weeks; longer functional independence."], ["Take-home", "Resect a single accessible metastasis in fit patients."], ["Paper", "Patchell RA, et al. N Engl J Med 1990;322:494–500."]] },
      { t: "N0574 (2016) and N107C (2017)", s: "Radiosurgery instead of whole-brain RT", rows: [["Question", "Does whole-brain radiotherapy add to radiosurgery or replace cavity radiosurgery?"], ["Result", "Whole-brain RT improved tumour control but caused more cognitive decline (92% with whole-brain RT vs 64% with radiosurgery alone at 3 months in N0574), without longer survival."], ["Take-home", "Prefer radiosurgery (including to the resection cavity) for limited metastases."], ["Paper", "Brown PD, et al. JAMA 2016;316:401–409. Lancet Oncol 2017;18:1049–1060."]] }
    ]},
    { h: "Hydrocephalus, children, epilepsy and functional", cards: [
      { t: "Shunt design trial (1998)", s: "Valve type", rows: [["Question", "Does valve design change shunt failure in children?"], ["Result", "No difference between three valve designs."], ["Take-home", "Valve choice matters less than technique and infection prevention."], ["Paper", "Drake JM, et al. Neurosurgery 1998;43:294–305."]] },

"Hemisection, usually penetrating. Same-side weakness and loss of position and vibration; opposite-side loss of pain and temperature from 1–2 levels below. Best outlook."
],

"Rare: B12 deficiency, nitrous oxide, syphilis, posterior compression. Loss of position and vibration with sensory ataxia (positive Romberg); strength kept."
],

"key": [
[
"Normal",
"Disc tissue stays within the edges of the vertebral body (ring apophyses)."
],
[
"Bulge",
"Disc tissue beyond the edges of the vertebral body over more than 25% of the circumference. It is not a herniation. The 2001 consensus used more than 50%."
],
[
"Asymmetric bulge",
"A bulge over more than 25% that is more marked on one side, often an adaptation to deformity such as scoliosis. Under the 2001 rules a 25–50% displacement was called a broad-based herniation."
],
[
"Herniation",
"Localised displacement of disc material involving 25% or less of the circumference (version 2.0, 2014). It is then described by shape."
],
[
"Protrusion",
"In every plane the herniated part is narrower than its base on the disc (base wider than the dome)."
],
[
"Extrusion",
"In at least one plane the fragment is wider than its base (narrow neck), or it extends above or below the disc level. Usually passes through a tear in the annulus."
],
[
"Migration",
"Disc material displaced up or down away from the site where it came out, whether or not still attached."
],
[
"Sequestration",
"An extruded fragment that has lost all continuity with the parent disc (free fragment)."
],
[
"Report",
"Also give the zone (central, subarticular, foraminal, extraforaminal) and the level (disc, suprapedicular, pedicular, infrapedicular)."
]
],

[
"PI",
"Pelvic incidence: angle between the line perpendicular to the S1 endplate at its midpoint and the line to the centre of the femoral heads. Fixed after growth; about 50° on average."
],
[
"PT",
"Pelvic tilt: angle between the vertical and the line from the femoral heads to the S1 midpoint. Rises (over 20°) when the pelvis tilts back to compensate for a flat back."
],
[
"SS",
"Sacral slope: angle between the S1 endplate and the horizontal (about 40°)."
],
[
"Rule",
"PI = PT + SS (here 53° = 13° + 40°). Lumbar lordosis should be within about 10° of PI."
]
],

 the disc — compressed</text><text class=\"ax-tb\" x=\"4.0\" y=\"404.2\" text-anchor=\"start\">Disc Ln–Ln+1: paracentral → Ln+1 · foraminal → Ln</text><line class=\"ax-l\" x1=\"0\" y1=\"409.2\" x2=\"320\" y2=\"409.2\"/><text class=\"ax-tb\" x=\"4.0\" y=\"422.2\" text-anchor=\"start\">B · Cervical: right posterolateral C5–C6 disc</text><image href=\"fig-roots-cervical.webp\" x=\"0\" y=\"429.2\" width=\"320\" height=\"247.9\" preserveAspectRatio=\"xMidYMid meet\"/><g class=\"ax-n\"><circle cx=\"297.1\" cy=\"512.2\" r=\"8.5\"/><text x=\"297.1\" y=\"515.6\" text-anchor=\"middle\">4</text></g><g class=\"ax-n\"><circle cx=\"204.8\" cy=\"548.4\" r=\"8.5\"/><text x=\"204.8\" y=\"551.8\" text-anchor=\"middle\">5</text></g><g class=\"ax-n\"><circle cx=\"298.9\" cy=\"569.9\" r=\"8.5\"/><text x=\"298.9\" y=\"573.3\" text-anchor=\"middle\">6</text></g><g class=\"ax-n\"><circle cx=\"297.1\" cy=\"637.6\" r=\"8.5\"/><text x=\"297.1\" y=\"641.0\" text-anchor=\"middle\">7</text></g><rect x=\"4\" y=\"685.1\" width=\"9\" height=\"9\" rx=\"2\" fill=\"#e0b23a\"/><g class=\"ax-n\"><circle cx=\"24.0\" cy=\"689.6\" r=\"7\"/><text x=\"24.0\" y=\"693.0\" text-anchor=\"middle\">4</text></g><text class=\"ax-ts\" x=\"35\" y=\"693.1\">C5 root: exits at C4–C5 — spared</text><rect x=\"4\" y=\"699.1\" width=\"9\" height=\"9\" rx=\"2\" fill=\"#8a5cc2\"/><g class=\"ax-n\"><circle cx=\"24.0\" cy=\"703.6\" r=\"7\"/><text x=\"24.0\" y=\"707.0\" text-anchor=\"middle\">5</text></g><text class=\"ax-ts\" x=\"35\" y=\"707.1\">C5–C6 herniation at the entrance of the foramen</text><rect x=\"4\" y=\"713.1\" width=\"9\" height=\"9\" rx=\"2\" fill=\"#1e6fd0\"/><g class=\"ax-n\"><circle cx=\"24.0\" cy=\"717.6\" r=\"7\"/><text x=\"24.0\" y=\"721.0\" text-anchor=\"middle\">6</text></g><text class=\"ax-ts\" x=\"35\" y=\"721.1\">C6 root: exits at C5–C6, above the C6 pedicle — compressed</text><rect x=\"4\" y=\"727.1\" width=\"9\" height=\"9\" rx=\"2\" fill=\"#e0b23a\"/><g class=\"ax-n\"><circle cx=\"24.0\" cy=\"731.6\" r=\"7\"/><text x=\"24.0\" y=\"735.0\" text-anchor=\"middle\">7</text></g><text class=\"ax-ts\" x=\"35\" y=\"735.1\">C7 root: exits at C6–C7 — spared</text><text class=\"ax-tb\" x=\"4.0\" y=\"750.1\" text-anchor=\"start\">Cervical disc C(n−1)–Cn → root Cn · C7–T1 → C8</text></svg>",
"key": [
[
1,
"Exiting root (L5 at L5–S1): leaves through the foramen just under the pedicle of its own vertebra, above the disc, so a paracentral herniation usually spares it."
],
[
2,
"Paracentral (posterolateral) herniation lies in the lateral recess, the commonest site in the lumbar spine."
],
[
3,
"Traversing root (S1 at L5–S1): crosses the disc in the lateral recess to leave one level lower. Compressed by this herniation: S1 radiculopathy (calf and sole pain, weak plantar flexion, reduced ankle reflex)."
],
[
4,
"In the neck the roots C1–C7 leave above the pedicle with the same number; C5 leaves at C4–C5 and is spared here."
],
[
5,
"Cervical posterolateral herniation at the entrance of the foramen."
],
[
6,
"C6 root, leaving at C5–C6 just above the C6 pedicle, is compressed: biceps and brachioradialis weakness, reduced biceps and brachioradialis reflexes, pain and numbness to the thumb."
],
[
7,
"C7 leaves at C6–C7 and does not cross the C5–C6 disc."
],
[
"Lumbar rule",
"At disc Ln–Ln+1 the exiting root is Ln and the traversing root is Ln+1. Paracentral discs hit the traversing root (L4–5 → L5, L5–S1 → S1); foraminal and far-lateral discs hit the exiting root (L4–5 → L4)."
],
[
"Cervical rule",
"Cervical roots run almost horizontally, so there is no long traversing course: a C(n−1)–Cn disc hits root Cn (C5–6 → C6, C6–7 → C7). C8 leaves between C7 and T1. A central cervical disc compresses the cord (myelopathy)."
],
[
"Tip",
"Compare the clinical root with the MRI level before operating; a large central lumbar disc can hit several sacral roots (cauda equina)."
]
],

"key": [
[
1,
"Anterior communicating artery (ACom complex): about 30%. May present with frontal or visual symptoms; often bleeds into the interhemispheric fissure or gyrus rectus."
],
[
2,
"ICA–posterior communicating artery junction: about 25%. Can cause a third nerve palsy with a dilated pupil. Shown on the left; it occurs on either side."
],
[
3,
"MCA bifurcation (M1–M2), just beyond the cut end of the trunk: about 20%. Often bleeds into the temporal lobe or sylvian fissure."
],
[
4,
"Basilar tip: about 7–10%; the commonest posterior circulation site."
],
[
5,
"Vertebral–PICA junction: about 3%."
],
[
6,
"ICA terminus (carotid bifurcation into ACA and MCA): about 5%; more common in younger patients."
],
[
"Not shown",
"Paraclinoid and ophthalmic ICA, pericallosal (distal ACA), superior cerebellar and AICA aneurysms."
],
[
"Note",
"About 85–95% arise in the anterior circulation. About 15–30% of patients have more than one aneurysm. Figures are approximate."
]
],

{
"id": "ica",
"sec": "Vessels",
"t": "Internal carotid artery segments",
"s": "Bouthillier C1–C7 along the skull base, each segment in its own colour",
"svg": "<svg class=\"ax\" viewBox=\"0 0 320 397.2\" role=\"img\" aria-label=\"Internal carotid artery segments\"><defs><marker id=\"ah-ica\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path class=\"ax-ah\" d=\"M0,0 L10,5 L0,10 z\"/></marker><marker id=\"ahb-ica\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path class=\"ax-ahb\" d=\"M0,0 L10,5 L0,10 z\"/></marker></defs><image href=\"fig-ica.webp\" x=\"0\" y=\"0\" width=\"320\" height=\"397.2\" preserveAspectRatio=\"xMidYMid meet\"/><text class=\"ax-ts ax-img\" x=\"4.0\" y=\"12.0\" text-anchor=\"start\">Front ← · side view</text></svg>",
"key": [
[
"C1",
"Cervical: carotid bifurcation to the carotid canal. No branches in the neck."
],
[
"C2",
"Petrous: inside the carotid canal, vertical then horizontal, to the foramen lacerum."
],
[
"C3",
"Lacerum: over the foramen lacerum to the petrolingual ligament."
],
[
"C4",
"Cavernous: within the cavernous sinus. Branches: meningohypophyseal trunk (MHT) and inferolateral trunk (ILT). An aneurysm here is extradural; rupture usually causes a carotid–cavernous fistula rather than SAH."
],
[
"C5",
"Clinoid: short segment between the proximal and distal dural rings, under the anterior clinoid process."
],
[
"C6",
"Ophthalmic: distal dural ring to just before the PCom. Branches: ophthalmic and superior hypophyseal arteries. With C5 this is the paraclinoid region."
],
[
"C7",
"Communicating: PCom origin to the terminal bifurcation into ACA and MCA. Branches: posterior communicating and anterior choroidal (AChA) arteries — common aneurysm sites."
],
[
"Older",
"Gibo and Rhoton used C1 cervical, C2 petrous, C3 cavernous and C4 supraclinoid, split into ophthalmic, communicating and choroidal parts. Fischer's original numbering ran against the blood flow."
]
],

"key": [
[
"ACA",
"Medial frontal and parietal lobes and the front of the corpus callosum. Leg weaker than arm, abulia, urinary incontinence. Its recurrent branch (Heubner) supplies the caudate head and anterior limb of the internal capsule (level 3)."
],
[
"MCA",
"Most of the lateral hemisphere and the temporal lobe. Face and arm weaker than leg, hemisensory loss, aphasia (dominant side), neglect (non-dominant side), gaze deviation."
],
[
"LSA",
"Lenticulostriate arteries from M1: putamen, globus pallidus, caudate body and the upper internal capsule. Lacunes (pure motor stroke) and hypertensive haemorrhage."
],
[
"AChA",
"Anterior choroidal artery from the ICA: lower posterior limb of the internal capsule, optic tract, uncus and medial temporal lobe. Hemiparesis, hemisensory loss and hemianopia."
],
[
"PCA",
"Occipital lobe, inferomedial temporal lobe (hippocampus) and, through deep branches (darker red), the thalamus. Homonymous hemianopia, memory loss, thalamic pain and sensory loss."
],
[
"Basilar",
"Perforators to the pons and, with PCA and SCA branches, the midbrain. Locked-in syndrome, ataxic hemiparesis, crossed cranial nerve signs."
],
[
"SCA",
"Upper cerebellum and upper vermis. Limb ataxia and dysarthria."
],
[
"AICA",
"Front and side of the lower cerebellum, middle cerebellar peduncle and lateral pons; usually the inner ear. Vertigo, same-side deafness, facial weakness and ataxia."
],
[
"PICA",
"Lower and back of the cerebellum, lower vermis and the lateral medulla: lateral medullary (Wallenberg) syndrome."
],
[
"Vertebral",
"Vertebral and anterior spinal artery branches to the medulla: medial medullary syndrome (opposite weakness, same-side tongue weakness)."
],
[
"Watershed",
"Cortical border zones between ACA–MCA and MCA–PCA (dashed) and the internal border zone in the deep white matter beside the ventricles (dotted): infarcts after severe hypotension or carotid occlusion."
],
[
"Note",
"Territories vary between people, for example a PCA filled from the PCom (fetal PCA) or a large AICA with a small PICA."
]
],

1,
"Subfalcine: the cingulate gyrus on the side of the mass is pushed under the free edge of the falx toward the other side. May compress the ACA (leg weakness). Midline shift on CT is the first sign."
],
[
2,
"Uncal (lateral transtentorial): the medial temporal lobe (uncus) slides over the tentorial edge. Third nerve palsy with a blown pupil on the same side, PCA infarct, and the opposite cerebral peduncle pressed against the tentorium (Kernohan notch: weakness on the same side as the mass)."
],
[
3,
"Central (downward transtentorial): diencephalon and midbrain pushed down through the tentorial notch. Small then mid-position fixed pupils, posturing, Duret brainstem haemorrhages."
],
[
4,
"Tonsillar: cerebellar tonsils pushed through the foramen magnum compress the medulla — apnoea and cardiac arrest. Avoid lumbar puncture with a posterior fossa mass."
],
[
"External",
"Not shown: brain bulging through a craniectomy or skull defect (transcalvarial)."
],
[
"Upward",
"Not shown: a posterior fossa mass pushes the cerebellum up through the notch, a risk when draining CSF from above."
]

"key": [
[
1,
"Lateral ventricles: they lie just off the midline, beyond the septum pellucidum (1). Choroid plexus makes most CSF, about 500 mL a day (about 0.35 mL/min). Total volume about 150 mL."
],
[
2,
"Foramen of Monro: block → one or both lateral ventricles enlarge (colloid cyst, tumour)."
],
[
3,
"Third ventricle (the oval inside it is the interthalamic adhesion)."
],
[
4,
"Cerebral aqueduct, behind the midbrain: block → lateral and third ventricles enlarge, fourth stays small (aqueductal stenosis, tectal tumour)."
],
[
5,
"Fourth ventricle and its outlets (Magendie in the midline, Luschka laterally): block → all four ventricles enlarge (posterior fossa tumour, Chiari, Dandy-Walker)."
],
[
6,
"Subarachnoid space and cisterns (light blue): prepontine and basal cisterns, cisterna magna, over the convexities and down around the spinal cord."
],
[
7,
"Arachnoid granulations into the superior sagittal sinus (dark blue): poor absorption (after SAH or meningitis) → communicating hydrocephalus. The sinuses meet at the torcula (dark blue pool at the back)."
],
[
"Flow",
"Lateral ventricles → foramen of Monro → third ventricle → aqueduct → fourth ventricle → outlets → cisterns → over the convexities to the granulations; part also flows down around the cord."
]
],

"key": [
[
1,
"Kocher's point: 3 cm from the midline (red dashed line; mid-pupillary line) and 1 cm in front of the coronal suture, about 11 cm behind the nasion. Usually the right side. Perpendicular to the skull; surface aims: the opposite medial canthus (front view; more reliable than the classic same-side canthus in CT studies) and the ear canal (side view). CSF at about 4–5 cm, foramen of Monro at 6–7 cm; never beyond 7 cm."
],
[
2,
"Keen's point: 3 cm above and 3 cm behind the top of the ear (2.5–3 cm in most descriptions). Perpendicular to the cortex, slightly upward; atrium (trigone) at about 3–4 cm. Usually the non-dominant side."
],
[
3,
"Bregma: coronal meets sagittal suture, about 12–13 cm behind the nasion."
],
[
4,
"Coronal suture: keep the Kocher burr hole 1–2 cm in front of it to stay off the motor strip."
],
[
5,
"Pterion: frontal, parietal, sphenoid and temporal bones meet, about two fingerbreadths above the zygomatic arch and a thumb's breadth behind the orbital rim. Over the anterior middle meningeal artery and the front of the sylvian fissure."
],
[
6,
"Squamous suture: upper edge of the temporal squama, arching over the ear."
],
[
7,
"External ear canal (under the pinna): EVD zero level and the side-view aim for Kocher."
],
[
8,
"Lateral orbital rim (frontozygomatic point): start of the sylvian line; the keyhole burr hole lies just behind it."
],
[
9,
"Lambda: where the sagittal and lambdoid sutures meet in the midline, about 6–6.5 cm above the inion."
],
[
10,
"Inion (external occipital protuberance): the zero point for posterior measurements. It overlies the torcula, and the transverse sinuses run sideways from it toward the asterion, so posterior burr holes stay above this level."
],
[
11,
"Frazier's point: 6 cm above the inion and 3–4 cm from the midline, on the parietal bone above the lambdoid suture. Usually the right side. Aim at the opposite medial canthus (best: 4 cm above it); ventricle at about 5–6 cm; for a shunt the catheter is passed on toward the frontal horn."
],
[
12,
"Dandy's point (purple, added): 3 cm above the inion and 2 cm from the midline, on the occipital bone below the lambdoid suture. Aim at a point 2 cm above the glabella; occipital horn at about 4–5 cm (5–6 cm in some reviews). The path crosses visual cortex and optic radiations."
],
[
"Others",
"Kaufman: 5 cm above the nasion (6 cm with a large frontal sinus), 3 cm from the midline, aimed 3 cm above the inion. Transorbital: emergency only. Both are shown in the 3D skull."
]
],

"key": [
[
1,
"Measure from the nasion (N) to the inion (I) along the midline and mark the halfway (1/2) and three-quarter (3/4) points."
],
[
2,
"Superior rolandic point (upper end of the central sulcus): about 2 cm behind the halfway mark. The posterior ear line reaches the midline here."
],
[
3,
"Frankfurt plane: from the lower rim of the orbit to the top of the ear canal (EAM). The two vertical lines are drawn at right angles to it."
],
[
4,
"Condylar line: at right angles to the Frankfurt plane, through the condyle of the mandible just in front of the ear canal."
],
[
5,
"Posterior ear line: at right angles to the Frankfurt plane, through the back of the mastoid process."
],
[
6,
"Sylvian line: from the lateral canthus (lateral orbital rim) to the 3/4 mark. The sylvian fissure lies along its front part; the pterion sits on it."
],
[
7,
"Inferior rolandic point (lower end of the central sulcus): where the condylar line crosses the sylvian line."
],
[
"Central sulcus",
"Join points 2 and 7. The motor strip (precentral gyrus, blue band) lies just in front of this line and the sensory cortex just behind it."
],
[
"Shortcut",
"The lower end also lies about 5 cm straight above the ear canal; this version is used in the 3D view."
],
[
"Accuracy",
"In cadaver comparisons the real points were usually within about 0.5–1 cm of these predictions (upper end slightly in front, lower end in front and below). Confirm with imaging, navigation or mapping before working near the motor strip."
]
],

],
[
3,
"Decompensation: the same small volume (a little more oedema or bleeding) now gives a large rise in ICP and falling perfusion, leading to herniation."
],

[
"P1",
"Percussion wave: arterial pulse transmitted through the choroid plexus."
],
[
"P2",
"Tidal wave: reflects brain compliance. P2 higher than P1 means the brain is stiff — a warning of rising ICP even before the number climbs."
],
[
"P3",
"Dicrotic wave: aortic valve closure."
],
[
"Trends",
"Plateau (Lundberg A) waves: ICP 50–100 mmHg for 5–20 minutes — exhausted reserve, treat urgently. B waves: 0.5–2 per minute, smaller rises often linked to breathing patterns."
],
[
"Check",
"A flat or damped trace suggests a blocked or misplaced catheter; flush only by protocol."
]
],

"key": [

1,
"Zero point: tragus (external ear canal), about the level of the foramen of Monro. Re-level after every change of bed height or patient position."
],
[
2,
"Level the zero of the scale with the tragus using a spirit or laser level (dashed line)."
],
[
3,
"Drip chamber: the height of its drip point above zero sets the pressure at which CSF drains, as ordered (often 10–15 cmH₂O; about 18 here). Keep it vertical (90°)."
],
[
4,
"Scale in cmH₂O (green) and mmHg (blue): 1 mmHg ≈ 1.36 cmH₂O, so 20 cmH₂O ≈ 15 mmHg."
],
[
5,
"Stopcocks: clamp before moving the patient, the bed or the head, before transfer and while re-levelling; unclamp afterwards. Keep the vent filter on the chamber dry, or drainage stops."
],
[
6,
"Collection bag: record output hourly. Sudden high output → overdrainage; no output and no pulsation → blocked or clamped catheter."
],
[
7,
"Head of bed usually 30°, head in the midline."
],
[
8,
"Catheter tip in the frontal horn. Check the exit site for CSF leak and signs of infection."
]
],

"Kocher's point: about 11 cm behind the nasion along the midline, then 3 cm to the side in the mid-pupillary line; about 1 cm in front of the coronal suture. Usually the right (non-dominant) side."
],
[
"Aim",
"Perpendicular to the skull. Surface aims: the ear canal (EAM) in the side view and, in the front view, the opposite medial canthus. In a CT simulation of 412 punctures this hit the frontal horn in 100%, perpendicular in 90.5%, and the classic same-side canthus in only 13.3%."
],
[
"Depth",
"CSF at about 4–5 cm (4.7 ± 0.5 cm aiming at the opposite canthus in CT simulation; 3–4 cm with large ventricles). The foramen of Monro is 6–7 cm from the outer table (inset); never beyond 7 cm."
],
[
"Check",
"Correct coagulopathy first; confirm position on CT."
]
