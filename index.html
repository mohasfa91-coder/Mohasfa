<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e66">
<meta name="description" content="Neurosurgery, neurology and psychiatry scores and calculators for clinicians.">
<title>NeuroSpine Scores</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow app column; list of scores, then a calculator with tap-to-answer option rows and a live result bar pinned to the bottom. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --ink: #13201f;
  --muted: #586967;
  --line: #d5dedd;
  --accent: #0b6e66;
  --accent-ink: #ffffff;
  --accent-soft: #e0f0ee;
  --ok: #2e7d32;
  --warn: #a35f00;
  --crit: #b3261e;
  --info: #35598f;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1515;
    --surface: #162120;
    --ink: #e4eceb;
    --muted: #97a8a6;
    --line: #293836;
    --accent: #4cbfb2;
    --accent-ink: #062320;
    --accent-soft: #143331;
    --ok: #74c47a;
    --warn: #e3a64a;
    --crit: #f07068;
    --info: #8eaee0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1515;
  --surface: #162120;
  --ink: #e4eceb;
  --muted: #97a8a6;
  --line: #293836;
  --accent: #4cbfb2;
  --accent-ink: #062320;
  --accent-soft: #143331;
  --ok: #74c47a;
  --warn: #e3a64a;
  --crit: #f07068;
  --info: #8eaee0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 14px 0 10px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.brand h1 { font-size: 24px; letter-spacing: .2px; }
.brand p { margin: 0; color: var(--muted); font-size: 13.5px; }
.mark {
  width: 36px; height: 36px; border-radius: 9px; flex: none;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .5px;
}
.iconbtn {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; height: 38px; min-width: 38px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 500;
  color: var(--ink); text-decoration: none;
}
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); }
.calc-title { flex: 1; min-width: 0; }
.calc-title h1 { font-size: 21px; line-height: 1.15; }
.calc-title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- home ---------- */
.notice {
  margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1px solid var(--line);
  display: flex; gap: 12px; align-items: flex-start; font-size: 14px;
}
.notice p { margin: 0; flex: 1; }
.notice button {
  border: 0; background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; flex: none;
}
.search { margin: 14px 0 4px; position: relative; }
.search input {
  width: 100%; height: 46px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface);
  padding: 0 14px 0 40px; font-size: 16px;
}
.search svg { position: absolute; left: 13px; top: 14px; width: 18px; height: 18px; color: var(--muted); }
.group { margin-top: 20px; }
.group h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--muted); font-family: var(--font-body); font-weight: 600; margin: 0 0 8px 2px;
}
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; text-decoration: none; color: inherit;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row .abbr {
  flex: none; width: 54px; height: 34px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.1;
}
.row .txt { flex: 1; min-width: 0; }
.row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.row .name .star { color: var(--warn); font-size: 13px; }
.row .desc { color: var(--muted); font-size: 13.5px; }
.row .chev { color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 18px 2px; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 26px; line-height: 1.5; }

/* ---------- calculator ---------- */
.intro { margin: 14px 0 0; color: var(--muted); font-size: 14.5px; }
.items { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 12px 10px;
}
.item.skipped { opacity: .5; }
.item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 8px; }
.item-head h3 { font-size: 17px; }
.item-head .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.item .hint { margin: -4px 2px 8px; font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; min-height: 44px;
}
.opt .dot {
  flex: none; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--muted); position: relative;
}
.opt.check .dot { border-radius: 5px; }
.opt .otext { flex: 1; min-width: 0; }
.opt .olabel { font-weight: 500; font-size: 15px; }
.opt .osub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.opt .pts {
  flex: none; font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--muted); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums;
}
.opt[aria-checked="true"], .opt[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft);
}
.opt[aria-checked="true"] .dot, .opt[aria-pressed="true"] .dot { border-color: var(--accent); }
.opt[aria-checked="true"] .dot::after, .opt[aria-pressed="true"] .dot::after {
  content: ""; position: absolute; inset: 3px; border-radius: inherit; background: var(--accent);
}
.opt[aria-checked="true"] .pts, .opt[aria-pressed="true"] .pts { color: var(--accent); }
.opt:disabled { cursor: default; }

.helper {
  margin-top: 10px; padding: 10px; border-radius: 8px;
  border: 1px dashed var(--line);
}
.helper h4 { margin: 0 0 6px; font-size: 14px; font-family: var(--font-body); font-weight: 600; }
.helper .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.helper label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.helper input {
  height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 8px; font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums;
}
.helper .out { margin-top: 8px; font-size: 14px; }
.helper .out strong { font-family: var(--font-mono); }
.helper .small { font-size: 12px; color: var(--muted); margin-top: 4px; }

.block { margin-top: 18px; }
.block h2 { font-size: 15px; margin: 0 0 6px 2px; }
.block ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--muted); }
.block li + li { margin-top: 4px; }

.spacer { height: 150px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 500;
}
.chip span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: 2px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.fieldhead { font-size: 20px; margin: 26px 2px -8px; }
.legend { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.legend strong { color: var(--ink); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(30px, 1fr)); gap: 5px; }
.segbtn {
  height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
  font-family: var(--font-mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums;
}
.segbtn[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.segbtn:disabled { cursor: default; }
.segsel { margin: 6px 2px 0; font-size: 13.5px; }
.segsel span { color: var(--muted); }
.nums { margin-top: 0; border-style: solid; }
.helper .fields.fields-2 { grid-template-columns: 1fr 1fr; }

/* ---------- result bar ---------- */
.result {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 0 12px calc(12px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.result-in {
  pointer-events: auto;
  max-width: 616px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.14);
  display: flex; overflow: hidden;
}
.stripe { width: 6px; flex: none; background: var(--line); }
.result[data-level="ok"] .stripe { background: var(--ok); }
.result[data-level="warn"] .stripe { background: var(--warn); }
.result[data-level="crit"] .stripe { background: var(--crit); }
.result[data-level="info"] .stripe { background: var(--info); }
.res-body { flex: 1; min-width: 0; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
.res-score {
  flex: none; min-width: 52px; text-align: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 28px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.res-score small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 4px; font-family: var(--font-body); }
.res-text { flex: 1; min-width: 0; }
.res-label { font-weight: 600; font-size: 15px; }
.result[data-level="ok"] .res-label { color: var(--ok); }
.result[data-level="warn"] .res-label { color: var(--warn); }
.result[data-level="crit"] .res-label { color: var(--crit); }
.result[data-level="info"] .res-label { color: var(--info); }
.res-detail { font-size: 13px; color: var(--muted); margin-top: 1px; }
.res-actions { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 8px 0; justify-content: center; }
.res-actions button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 7px;
  font-size: 12.5px; font-weight: 600; padding: 5px 10px;
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 120px; z-index: 7;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 380px) {
  .res-score { font-size: 24px; min-width: 44px; }
  .helper .fields { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="calc-defs">
/* ===== Score definitions (pure data + pure functions; tested separately) ===== */
var opt = function (v, label, pts, sub) { return { v: v, label: label, pts: pts, sub: sub }; };
var YES_NO = [opt("no", "No"), opt("yes", "Yes")];
var roman = ["0", "I", "II", "III", "IV", "V", "VI"];
function sumPts(calc, ans, ids) {
  var t = 0;
  ids.forEach(function (id) {
    var item = calc.items.find(function (i) { return i.id === id; });
    var o = item.options.find(function (x) { return x.v === ans[id]; });
    t += (typeof o.pts === "number" ? o.pts : 0);
  });
  return t;
}
function missing(ans, ids) { return ids.filter(function (id) { return ans[id] === undefined; }).length; }

var CALCS = [
/* ---------------- HEAD INJURY ---------------- */
{
  id: "gcs", abbr: "GCS", name: "Glasgow Coma Scale + GCS‑P", cat: "Head injury & coma",
  desc: "Level of consciousness, with optional pupil reactivity",
  keywords: "coma consciousness pupils gcs-p tbi",
  intro: "Record the best response in each component. Add pupil reactivity to get GCS-P.",
  items: [
    { id: "e", label: "Eye opening", options: [
      opt(4, "Spontaneous", 4), opt(3, "To sound", 3), opt(2, "To pressure", 2), opt(1, "None", 1),
      opt("NT", "Not testable", null, "e.g., eyes closed by swelling")] },
    { id: "v", label: "Verbal response", options: [
      opt(5, "Oriented", 5), opt(4, "Confused", 4), opt(3, "Words", 3, "inappropriate words"),
      opt(2, "Sounds", 2, "incomprehensible sounds"), opt(1, "None", 1),
      opt("NT", "Not testable", null, "e.g., intubated")] },
    { id: "m", label: "Best motor response", options: [
      opt(6, "Obeys commands", 6), opt(5, "Localising", 5), opt(4, "Normal flexion", 4, "withdrawal"),
      opt(3, "Abnormal flexion", 3, "decorticate"), opt(2, "Extension", 2, "decerebrate"), opt(1, "None", 1),
      opt("NT", "Not testable", null, "e.g., paralysed or sedated")] },
    { id: "p", label: "Pupil reactivity", tag: "optional, for GCS-P", options: [
      opt(0, "Both pupils react to light", -0), opt(1, "One pupil unreactive", -1), opt(2, "Both pupils unreactive", -2)] }
  ],
  compute: function (a) {
    var n = missing(a, ["e", "v", "m"]);
    if (n) return { complete: false, remaining: n };
    var comp = "E" + a.e + " V" + a.v + " M" + a.m;
    if (a.e === "NT" || a.v === "NT" || a.m === "NT") {
      return { complete: true, score: "—", unit: "GCS", level: "info",
        label: "Total cannot be summed", detail: "Report the components: " + comp,
        summary: "GCS not summable (" + comp + ")" };
    }
    var t = a.e + a.v + a.m;
    var sev = t >= 13 ? ["Mild (13–15)", "ok"] : t >= 9 ? ["Moderate (9–12)", "warn"] : ["Severe (3–8)", "crit"];
    var detail = comp;
    var summary = "GCS " + t + " (" + comp + "), " + sev[0].split(" ")[0].toLowerCase();
    if (a.p !== undefined) {
      var gp = t - a.p;
      detail += " · GCS-P " + gp;
      summary += "; GCS-P " + gp;
    }
    return { complete: true, score: t, unit: "GCS", label: sev[0], level: sev[1], detail: detail, summary: summary };
  },
  notes: [
    "Severity bands (mild 13–15, moderate 9–12, severe 3–8) apply to head injury.",
    "GCS-P = GCS total minus the pupil reactivity score (0, 1 or 2); range 1–15.",
    "When a component cannot be tested, report it as NT rather than guessing a number."
  ],
  refs: [
    "Teasdale G, Jennett B. Assessment of coma and impaired consciousness. Lancet 1974;2:81–84.",
    "Brennan PM, Murray GD, Teasdale GM. Simplifying the use of prognostic information in traumatic brain injury (GCS-Pupils). J Neurosurg 2018;128:1612–1620."
  ]
},
{
  id: "marshall", abbr: "MAR", name: "Marshall CT classification", cat: "Head injury & coma",
  desc: "CT category in traumatic brain injury",
  keywords: "ct tbi head injury midline shift cisterns mass lesion",
  intro: "Answer from the top. Each question is needed only if the one above is No.",
  items: [
    { id: "evac", label: "Mass lesion surgically evacuated?", options: YES_NO },
    { id: "mass", label: "High- or mixed-density lesion > 25 mL, not evacuated?", options: YES_NO,
      when: function (a) { return a.evac === "no"; } },
    { id: "mls", label: "Midline shift > 5 mm?", options: YES_NO,
      when: function (a) { return a.evac === "no" && a.mass === "no"; } },
    { id: "cis", label: "Basal cisterns compressed or absent?", options: YES_NO,
      when: function (a) { return a.evac === "no" && a.mass === "no" && a.mls === "no"; } },
    { id: "path", label: "Any visible intracranial pathology?", hint: "Includes small lesions, bone fragments and foreign bodies.", options: YES_NO,
      when: function (a) { return a.evac === "no" && a.mass === "no" && a.mls === "no" && a.cis === "no"; } }
  ],
  compute: function (a) {
    var r = null;
    if (a.evac === "yes") r = ["V", "Evacuated mass lesion", "warn"];
    else if (a.evac === "no" && a.mass === "yes") r = ["VI", "Non-evacuated mass lesion > 25 mL", "crit"];
    else if (a.mass === "no" && a.mls === "yes") r = ["IV", "Diffuse injury IV (shift)", "crit"];
    else if (a.mls === "no" && a.cis === "yes") r = ["III", "Diffuse injury III (swelling)", "warn"];
    else if (a.cis === "no" && a.path === "yes") r = ["II", "Diffuse injury II", "info"];
    else if (a.cis === "no" && a.path === "no") r = ["I", "Diffuse injury I", "ok"];
    if (!r) return { complete: false, remaining: 1 };
    var details = {
      I: "No visible intracranial pathology",
      II: "Cisterns present, shift 0–5 mm, no high/mixed lesion > 25 mL",
      III: "Cisterns compressed or absent, shift 0–5 mm, no lesion > 25 mL",
      IV: "Shift > 5 mm, no high/mixed lesion > 25 mL",
      V: "Any lesion surgically evacuated",
      VI: "High or mixed density lesion > 25 mL, not evacuated"
    };
    return { complete: true, score: r[0], unit: "Marshall", label: r[1], level: r[2], detail: details[r[0]],
      summary: "Marshall CT category " + r[0] + ": " + r[1] };
  },
  notes: ["Categories V and VI take priority over the diffuse injury categories."],
  refs: ["Marshall LF, Marshall SB, Klauber MR, et al. A new classification of head injury based on computerized tomography. J Neurosurg 1991;75:S14–S20."]
},

/* ---------------- CEREBROVASCULAR ---------------- */
{
  id: "ich", abbr: "ICH", name: "ICH score", cat: "Cerebrovascular",
  desc: "30-day mortality in spontaneous intracerebral haemorrhage",
  keywords: "intracerebral hemorrhage haemorrhage abc/2 volume mortality hemphill",
  intro: "Use the GCS on presentation and the initial CT. The ABC/2 helper fills the volume item for you.",
  items: [
    { id: "gcs", label: "GCS", options: [opt("13-15", "13–15", 0), opt("5-12", "5–12", 1), opt("3-4", "3–4", 2)] },
    { id: "vol", label: "ICH volume", helper: "abc2", options: [opt("lt30", "< 30 mL", 0), opt("ge30", "≥ 30 mL", 1)] },
    { id: "ivh", label: "Intraventricular extension", options: [opt("no", "No", 0), opt("yes", "Yes", 1)] },
    { id: "infra", label: "Origin", options: [opt("supra", "Supratentorial", 0), opt("infra", "Infratentorial", 1)] },
    { id: "age", label: "Age", options: [opt("lt80", "< 80 years", 0), opt("ge80", "≥ 80 years", 1)] }
  ],
  compute: function (a) {
    var ids = ["gcs", "vol", "ivh", "infra", "age"];
    var n = missing(a, ids);
    if (n) return { complete: false, remaining: n };
    var t = sumPts(this, a, ids);
    var mort = ["0%", "13%", "26%", "72%", "97%", "100%", "not observed in the derivation cohort"][t];
    var level = t <= 1 ? "ok" : t === 2 ? "warn" : "crit";
    return { complete: true, score: t, unit: "of 6", level: level,
      label: "30-day mortality " + (t === 6 ? "very high" : mort),
      detail: t === 6 ? "Score 6 was not observed in the derivation cohort" : "Observed 30-day mortality in the derivation cohort",
      summary: "ICH score " + t + "/6 (30-day mortality " + mort + ")" };
  },
  notes: [
    "ABC/2: A = largest diameter on the slice with the largest haemorrhage, B = largest diameter perpendicular to A on the same slice, C = number of slices with haemorrhage × slice thickness (all in cm). Volume ≈ A × B × C / 2 mL.",

  items: [{ id: "g", label: "Appearance", options: [

}),
pickCalc({

pickCalc({

{

  intro: "Measure at the same level on a lateral cervical radiograph.",

  },
  notes: ["The ratio cancels radiographic magnification but has a high false-positive rate in large athletes with big vertebral bodies."],

},
pickCalc({
  id: "k-line", abbr: "K-line", name: "K-line (cervical OPLL)", cat: "Spine: degenerative",
  desc: "Predicts benefit of laminoplasty in OPLL", keywords: "k-line opll ossification posterior longitudinal ligament laminoplasty", intro: "Draw a line joining the canal midpoints at C2 and C7 on a neutral lateral radiograph.", unit: "K-line",

}),

    P(3, "Grade 3 — Severe", "Narrowing, large osteophytes, severe hypertrophy, severe erosions or subchondral cysts", "crit")] }],
  refs: ["Weishaupt D, Zanetti M, Boos N, Hodler J. MR imaging and CT in osteoarthritis of the lumbar facet joints. Skeletal Radiol 1999;28:215–219."]
}),
{

  desc: "Size and location of a disc herniation on axial MRI", keywords: "msu michigan state university disc herniation classification size location intra-facet line",
  intro: "Draw the intra-facet line between the medial edges of the facet joints at the level of maximal extrusion on axial T2.",
  items: [

    { id: "loc", label: "Location", hint: "The intra-facet line is divided into four quarters; the two central quarters are zone A.", options: [

  ],
  compute: function (a) {

    var code = a.size + "-" + a.loc;
    var surg = (code === "2-B" || code === "2-AB");

      label: a.size === 1 ? "Small herniation" : a.size === 2 ? "Moderate herniation" : "Large herniation",
      detail: surg ? "2-B and 2-AB were the types most often operated on in the original series" : "Combine with symptoms and examination",
      summary: "MSU classification " + code };
  },
  refs: ["Mysliwiec LW, Cholewicki J, Winkelpleck MD, Eis GP. MSU classification for herniated lumbar discs on MRI: toward developing objective criteria for surgical selection. Eur Spine J 2010;19:1087–1093."]
},

/* ---------- Spine: tumour ---------- */
pickCalc({

  items: [{ id: "g", label: "Compression", options: [

    P("1a", "Grade 1a", "Epidural impingement without deformation of the thecal sac", "ok", "1a", "Low-grade compression"),
    P("1b", "Grade 1b", "Deformation of the thecal sac without abutting the cord", "ok", "1b", "Low-grade compression"),
    P("1c", "Grade 1c", "Deformation of the thecal sac, abutting the cord without compression", "warn", "1c", "Low-grade compression"),
    P("2", "Grade 2", "Cord compression with CSF still visible around the cord", "crit", "2", "High-grade compression"),
    P("3", "Grade 3", "Cord compression with no CSF around the cord", "crit", "3", "High-grade compression")] }],
  notes: ["In the NOMS framework, high-grade compression from a radioresistant tumour usually needs surgical decompression before radiosurgery."],
  refs: ["Bilsky MH, Laufer I, Fourney DR, et al. Reliability analysis of the epidural spinal cord compression scale. J Neurosurg Spine 2010;13:324–328."]
}),
sumCalc({
  id: "tokuhashi", abbr: "Toku", name: "Revised Tokuhashi score", cat: "Spine: tumour",
  desc: "Expected survival with spinal metastases", keywords: "tokuhashi spinal metastasis prognosis survival score revised", intro: "Score at the time of assessment for surgery.", outOf: 15,
  items: [
    { id: "kps", label: "General condition (KPS)", options: [opt("poor", "Poor, KPS 10–40%", 0), opt("mod", "Moderate, KPS 50–70%", 1), opt("good", "Good, KPS 80–100%", 2)] },
    { id: "ebm", label: "Extraspinal bone metastases", options: [opt("ge3", "≥ 3", 0), opt("1-2", "1–2", 1), opt("0", "None", 2)] },

    { id: "prim", label: "Primary site", options: [

}),
sumCalc({

    { id: "visc", label: "Visceral metastases", options: [opt("none", "None", 0), opt("treat", "Treatable (surgery or embolisation)", 2), opt("untreat", "Untreatable", 4)] },
    { id: "bone", label: "Bone metastases (including spine)", options: [opt("sol", "Solitary or isolated", 1), opt("mult", "Multiple", 2)] }
  ],

  refs: ["Tomita K, Kawahara N, Kobayashi T, et al. Surgical strategy for spinal metastases. Spine 2001;26:298–306."]
})
];

CALCS = CALCS.concat(MORE).concat(SPINE);
CALCS.forEach(function (c) {
  if (c.scale) c.items.forEach(function (i) { if (!i.options && !i.type) { i.options = c.scale; i.compact = true; } });
});
var FIELDS = [
  { name: "Neurosurgery", cats: ["Head injury & coma", "Cerebrovascular", "Spine trauma", "Spine: stability & deformity", "Spine: degenerative", "Spine: tumour", "Neuro-oncology & skull base", "Hydrocephalus & subdural"] },
  { name: "Neurology", cats: ["Stroke, TIA & SAH", "Neuromuscular", "Movement & tone", "Seizures & ICU"] },
  { name: "Psychiatry", cats: ["Depression & anxiety", "Substance use", "Psychopharmacology"] }
];
var CATS = [].concat.apply([], FIELDS.map(function (f) { return f.cats; }));
if (typeof module !== "undefined") module.exports = { CALCS: CALCS, CATS: CATS, FIELDS: FIELDS };

<script>
/* ===== UI ===== */
(function () {
  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var answers = {};      // per-calculator answers, kept while the page is open
  var helperVals = {};   // ABC/2 inputs
  var query = "";

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var favs = store.get("nss-favs", []);
  var acknowledged = store.get("nss-ack", false);
  var field = store.get("nss-field", "All");

  var ICON = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>'
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function byId(id) { return CALCS.find(function (c) { return c.id === id; }); }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }
  function fmtPts(p) {
    if (p === null || p === undefined) return "";
    if (p < 0 || Object.is(p, -0)) return "−" + Math.abs(p);
    return "+" + p;
  }

  /* ---------- home ---------- */
  function rowHtml(c) {
    var fav = favs.indexOf(c.id) !== -1;
    return '<a class="row" href="#' + c.id + '">' +
      '<span class="abbr">' + esc(c.abbr) + '</span>' +
      '<span class="txt"><span class="name">' + esc(c.name) + (fav ? '<span class="star" aria-label="Starred">★</span>' : '') + '</span>' +
      '<span class="desc">' + esc(c.desc) + '</span></span>' +
      '<span class="chev">' + ICON.chev + '</span></a>';
  }
  function renderHome() {
    document.title = "NeuroSpine Scores";
    var q = query.trim().toLowerCase();
    var match = function (c) { return !q || (c.name + " " + c.abbr + " " + c.desc + " " + c.keywords + " " + c.cat).toLowerCase().indexOf(q) !== -1; };
    var html = '<header class="topbar"><span class="mark">NS</span><div class="brand"><h1>NeuroSpine Scores</h1><p>Neurosurgery, neurology and psychiatry calculators</p></div></header>';
    if (!acknowledged) {
      html += '<div class="notice" id="notice"><p>For healthcare professionals. These scores support clinical judgment and do not replace it.</p><button type="button" id="ack">Got it</button></div>';
    }
    html += '<div class="search">' + ICON.search + '<input id="q" type="search" placeholder="Search, e.g. burst, NIHSS, PHQ-9" aria-label="Search scores" value="' + esc(query) + '"></div>';
    html += '<div class="chips" role="group" aria-label="Filter by specialty">' +
      ["All"].concat(FIELDS.map(function (f) { return f.name; })).map(function (n) {
        var count = n === "All" ? CALCS.length : CALCS.filter(function (c) { return fieldOf(c) === n; }).length;
        return '<button type="button" class="chip" data-field="' + esc(n) + '" aria-pressed="' + (field === n) + '">' + esc(n) + ' <span>' + count + '</span></button>';
      }).join("") + '</div>';
    var shown = 0;
    var inField = function (c) { return field === "All" || fieldOf(c) === field; };
    var favCalcs = CALCS.filter(function (c) { return favs.indexOf(c.id) !== -1 && match(c) && inField(c); });
    if (favCalcs.length) {
      html += '<section class="group"><h2>Starred</h2><div class="list">' + favCalcs.map(rowHtml).join("") + '</div></section>';
    }
    FIELDS.forEach(function (f) {
      if (field !== "All" && field !== f.name) return;
      var fieldHtml = "";
      f.cats.forEach(function (cat) {
        var list = CALCS.filter(function (c) { return c.cat === cat && match(c); });
        shown += list.length;
        if (list.length) fieldHtml += '<section class="group"><h2>' + esc(cat) + '</h2><div class="list">' + list.map(rowHtml).join("") + '</div></section>';
      });
      if (fieldHtml) html += '<h2 class="fieldhead">' + esc(f.name) + '</h2>' + fieldHtml;
    });
    if (!shown) html += '<p class="empty">No score matches “' + esc(query) + '”' + (field !== "All" ? ' in ' + esc(field) : '') + '.</p>';
    html += '<p class="foot">' + CALCS.length + ' scores. Each calculator lists its original references. Check results against your local protocols.</p>';
    app.innerHTML = html;
    document.getElementById("result") && document.getElementById("result").remove();
    var qi = document.getElementById("q");
    qi.addEventListener("input", function () {
      query = qi.value;
      var pos = qi.selectionStart;
      renderHome();
      var n = document.getElementById("q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
    });
    var ack = document.getElementById("ack");
    if (ack) ack.addEventListener("click", function () { acknowledged = true; store.set("nss-ack", true); document.getElementById("notice").remove(); });
    app.querySelectorAll("[data-field]").forEach(function (b) {
      b.addEventListener("click", function () { field = b.dataset.field; store.set("nss-field", field); renderHome(); });
    });
  }
  function fieldOf(c) {
    var f = FIELDS.find(function (x) { return x.cats.indexOf(c.cat) !== -1; });
    return f ? f.name : "";
  }

  /* ---------- calculator ---------- */
  function isActive(item, a) { return !item.when || item.when(a); }

  function renderCalc(c) {
    document.title = c.name + " · NeuroSpine Scores";
    var a = answers[c.id] || (answers[c.id] = {});
    var fav = favs.indexOf(c.id) !== -1;
    var html = '<header class="topbar">' +
      '<a class="iconbtn" href="#" aria-label="All scores">' + ICON.back + '</a>' +
      '<div class="calc-title"><h1>' + esc(c.name) + '</h1><p>' + esc(c.cat) + '</p></div>' +
      '<button type="button" class="iconbtn" id="fav" aria-pressed="' + fav + '" aria-label="Star this score">' + (fav ? ICON.star : ICON.starO) + '</button>' +
      '</header>';
    html += '<p class="intro">' + esc(c.intro) + '</p>';
    if (c.scale) {
      html += '<p class="legend"><strong>Scale:</strong> ' + c.scale.map(function (o) { return o.v + " = " + esc(o.label); }).join(" · ") + '</p>';
    }
    html += '<div class="items">';
    c.items.forEach(function (item) {
      var active = isActive(item, a);
      html += '<section class="item' + (active ? '' : ' skipped') + '" aria-labelledby="h-' + item.id + '">';
      html += '<div class="item-head"><h3 id="h-' + item.id + '">' + esc(item.label) + '</h3>' +
        (item.tag ? '<span class="tag">' + esc(item.tag) + '</span>' : (!active ? '<span class="tag">Not needed</span>' : '')) + '</div>';
      if (item.hint) html += '<p class="hint">' + esc(item.hint) + '</p>';
      if (item.type === "toggle") {
        var on = !!a[item.id];
        html += '<div class="opts"><button type="button" class="opt check" data-toggle="' + item.id + '" aria-pressed="' + on + '">' +
          '<span class="dot"></span><span class="otext"><span class="olabel">' + esc(item.toggle.label) + '</span>' +
          (item.toggle.sub ? '<span class="osub">' + esc(item.toggle.sub) + '</span>' : '') + '</span>' +
          '<span class="pts">' + (item.toggle.pts !== undefined ? fmtPts(item.toggle.pts) : '') + '</span></button></div>';
      } else if (item.type === "checks") {
        html += '<div class="opts">';
        item.checks.forEach(function (ch) {
          var on = !!a[ch.id];
          html += '<button type="button" class="opt check" data-check="' + ch.id + '" aria-pressed="' + on + '">' +
            '<span class="dot"></span><span class="otext"><span class="olabel">' + esc(ch.label) + '</span>' +
            (ch.sub ? '<span class="osub">' + esc(ch.sub) + '</span>' : '') + '</span>' +
            '<span class="pts">' + (ch.pts ? fmtPts(ch.pts) : '') + '</span></button>';
        });
        html += '</div>';
      } else if (item.type === "numbers") {
        html += '<div class="helper nums"><div class="fields fields-' + item.fields.length + '">';
        item.fields.forEach(function (f) {
          var v = a[f.id];
          html += '<label for="n-' + f.id + '">' + esc(f.label) + '<input id="n-' + f.id + '" data-num="' + f.id + '" inputmode="decimal" value="' + (typeof v === "number" ? v : "") + '"></label>';
        });
        html += '</div></div>';
      } else if (item.compact) {
        var selOpt = item.options.find(function (o) { return o.v === a[item.id]; });
        html += '<div class="seg" role="radiogroup" aria-labelledby="h-' + item.id + '">';
        item.options.forEach(function (o, idx) {
          var sel = a[item.id] === o.v;
          html += '<button type="button" class="segbtn" role="radio" aria-checked="' + sel + '" aria-label="' + esc(o.v + ": " + o.label) + '"' + (active ? '' : ' disabled') +
            ' data-item="' + item.id + '" data-idx="' + idx + '">' + esc(o.v) + '</button>';
        });
        html += '</div><div class="segsel">' + (selOpt ? esc(selOpt.label) : '<span>Not answered</span>') + '</div>';
      } else {
        html += '<div class="opts" role="radiogroup" aria-labelledby="h-' + item.id + '">';
        item.options.forEach(function (o, idx) {
          var sel = a[item.id] === o.v;
          html += '<button type="button" class="opt" role="radio" aria-checked="' + sel + '"' + (active ? '' : ' disabled') +
            ' data-item="' + item.id + '" data-idx="' + idx + '">' +
            '<span class="dot"></span><span class="otext"><span class="olabel">' + esc(o.label) + '</span>' +
            (o.sub ? '<span class="osub">' + esc(o.sub) + '</span>' : '') + '</span>' +
            '<span class="pts">' + fmtPts(o.pts) + '</span></button>';
        });
        html += '</div>';
      }
      if (item.helper === "abc2") {
        var h = helperVals[c.id] || {};
        html += '<div class="helper"><h4>ABC/2 volume helper</h4><div class="fields">' +
          '<label for="abc-a">A (cm)<input id="abc-a" inputmode="decimal" value="' + esc(h.a || "") + '"></label>' +
          '<label for="abc-b">B (cm)<input id="abc-b" inputmode="decimal" value="' + esc(h.b || "") + '"></label>' +
          '<label for="abc-c">C (cm)<input id="abc-c" inputmode="decimal" value="' + esc(h.c || "") + '"></label>' +
          '</div><div class="out" id="abc-out">' + abcText(h) + '</div>' +
          '<div class="small">C = slices with blood × slice thickness in cm (e.g., 6 slices × 0.5 cm = 3).</div></div>';
      }
      html += '</section>';
    });
    html += '</div>';
    if (c.notes && c.notes.length) html += '<section class="block"><h2>Notes</h2><ul>' + c.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("") + '</ul></section>';
    if (c.refs && c.refs.length) html += '<section class="block"><h2>References</h2><ul>' + c.refs.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("") + '</ul></section>';
    html += '<div class="spacer"></div>';
    app.innerHTML = html;

    var bar = document.getElementById("result");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "result"; bar.className = "result";
      bar.setAttribute("aria-live", "polite");
      document.body.appendChild(bar);
    }
    updateResult(c);

    app.querySelectorAll("[data-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var item = c.items.find(function (i) { return i.id === btn.dataset.item; });
        var o = item.options[+btn.dataset.idx];
        a[item.id] = o.v;
        clearInactive(c, a);
        rerenderKeepScroll(c);
      });
    });
    app.querySelectorAll("[data-check]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        a[btn.dataset.check] = !a[btn.dataset.check];
        rerenderKeepScroll(c);
      });
    });
    app.querySelectorAll("[data-num]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var v = parseFloat(inp.value.replace(",", "."));
        if (isFinite(v)) a[inp.dataset.num] = v; else delete a[inp.dataset.num];
        updateResult(c);
      });
    });
    app.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        a[btn.dataset.toggle] = !a[btn.dataset.toggle];
        rerenderKeepScroll(c);
      });
    });
    var favBtn = document.getElementById("fav");
    favBtn.addEventListener("click", function () {
      var i = favs.indexOf(c.id);
      if (i === -1) favs.push(c.id); else favs.splice(i, 1);
      store.set("nss-favs", favs);
      toast(i === -1 ? "Added to Starred" : "Removed from Starred");
      rerenderKeepScroll(c);
    });
    ["a", "b", "c"].forEach(function (k) {
      var inp = document.getElementById("abc-" + k);
      if (!inp) return;
      inp.addEventListener("input", function () {
        var h = helperVals[c.id] || (helperVals[c.id] = {});
        h[k] = inp.value;
        document.getElementById("abc-out").innerHTML = abcText(h);
        var v = abcVol(h);
        if (v !== null) {
          var want = v >= 30 ? "ge30" : "lt30";
          if (a.vol !== want) {
            a.vol = want;
            app.querySelectorAll('[data-item="vol"]').forEach(function (b) {
              var o = c.items.find(function (i) { return i.id === "vol"; }).options[+b.dataset.idx];
              b.setAttribute("aria-checked", String(o.v === want));
            });
          }
          updateResult(c);
        }
      });
    });
  }
  function abcVol(h) {
    var A = parseFloat(String(h.a || "").replace(",", ".")), B = parseFloat(String(h.b || "").replace(",", ".")), C = parseFloat(String(h.c || "").replace(",", "."));
    if (!(A > 0 && B > 0 && C > 0)) return null;
    return A * B * C / 2;
  }
  function abcText(h) {
    var v = abcVol(h);
    if (v === null) return '<span style="color:var(--muted)">Enter A, B and C to estimate the volume.</span>';
    return 'Estimated volume <strong>' + v.toFixed(1) + ' mL</strong> → ' + (v >= 30 ? '≥ 30 mL selected' : '< 30 mL selected');
  }
  function clearInactive(c, a) {
    c.items.forEach(function (item) { if (!isActive(item, a)) delete a[item.id]; });
  }
  function rerenderKeepScroll(c) {
    var y = window.scrollY;
    renderCalc(c);
    window.scrollTo(0, y);
  }
  function updateResult(c) {
    var a = answers[c.id] || {};
    var r = c.compute(a);
    var bar = document.getElementById("result");
    if (!r.complete) {
      bar.dataset.level = "";
      bar.innerHTML = '<div class="result-in"><span class="stripe"></span><div class="res-body">' +
        '<div class="res-score" style="color:var(--muted)">–</div><div class="res-text"><div class="res-label" style="color:var(--muted)">' +
        (r.remaining === 1 ? "Answer 1 more item" : "Answer " + r.remaining + " more items") + '</div>' +
        '<div class="res-detail">The result updates as you tap.</div></div></div>' +
        '<div class="res-actions"><button type="button" id="reset">Reset</button></div></div>';
    } else {
      bar.dataset.level = r.level;
      bar.innerHTML = '<div class="result-in"><span class="stripe"></span><div class="res-body">' +
        '<div class="res-score">' + esc(r.score) + '<small>' + esc(r.unit) + '</small></div>' +
        '<div class="res-text"><div class="res-label">' + esc(r.label) + '</div>' +
        (r.detail ? '<div class="res-detail">' + esc(r.detail) + '</div>' : '') + '</div></div>' +
        '<div class="res-actions"><button type="button" id="copy">Copy</button><button type="button" id="reset">Reset</button></div></div>';
      document.getElementById("copy").addEventListener("click", function () {
        var text = r.summary;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { toast("Copied: " + text); }, function () { toast(text); });
        } else { toast(text); }
      });
    }
    document.getElementById("reset").addEventListener("click", function () {
      answers[c.id] = {}; helperVals[c.id] = {};
      renderCalc(c); window.scrollTo(0, 0);
    });
  }

  /* ---------- routing ---------- */
  function route() {
    var id = (location.hash || "").replace(/^#/, "");
    var c = id && byId(id);
    if (c) { renderCalc(c); window.scrollTo(0, 0); }
    else { renderHome(); }
  }
  window.addEventListener("hashchange", route);
  route();

  /* ---------- offline support (works when hosted on your own https site) ---------- */
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
      });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
